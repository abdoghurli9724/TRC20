<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سحب الأموال - VirtualMall</title>
  <link rel="stylesheet" href="profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .custom-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card, #1e293b);
      border: 1px solid var(--accent-green, #10b981);
      color: var(--text-primary, #f8fafc);
      padding: 12px 24px;
      border-radius: 12px;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="customToast" class="custom-toast"></div>

  <div class="header-bar">
    <div class="brand-logo"><i class="bi bi-wallet2" style="color: var(--accent-gold);"></i> سحب <span>الأموال</span></div>
    <div class="vip-badge" id="userVipBadge">جاري التحميل...</div>
  </div>

  <div style="padding: 20px;">
    <div class="card-box" style="margin-bottom: 20px;">
      <span class="form-label">الرصيد المتاح للسحب</span>
      <h2 id="availableBalance" style="color: var(--accent-green); font-size: 1.8rem; font-weight: 800; margin-top: 5px;">0.00 USDT</h2>
    </div>

    <div class="card-box">
      <h3 style="margin-bottom: 16px; font-size: 1rem; color: var(--accent-gold);">تفاصيل عملية السحب</h3>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label">مبلغ السحب (USDT)</label>
        <input type="number" id="withdrawAmount" class="form-input" placeholder="أدخل المبلغ المراد سحبه">
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label">عنوان محفظة الاستلام (TRC20)</label>
        <input type="text" id="withdrawAddress" class="form-input" placeholder="أدخل عنوان محفظتك هنا">
      </div>

      <button type="button" class="submit-btn" style="width: 100%;" onclick="submitWithdrawRequest()">تأكيد طلب السحب</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="bi bi-house-door"></i><span>الرئيسية</span></a>
    <a href="tasks.html" class="nav-item"><i class="bi bi-list-check"></i><span>المهام</span></a>
    <a href="team.html" class="nav-item"><i class="bi bi-people"></i><span>الفريق</span></a>
    <a href="profile.html" class="nav-item"><i class="bi bi-person"></i><span>حسابي</span></a>
  </div>

  <script src="db.js"></script>
  <script>
    function showCustomToast(message, isSuccess = true) {
      const toast = document.getElementById('customToast');
      toast.innerText = message;
      toast.style.borderColor = isSuccess ? 'var(--accent-green, #10b981)' : 'var(--accent-red, #ef4444)';
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    async function initPage() {
      const user = await getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      document.getElementById("userVipBadge").innerHTML = `<i class="bi bi-award"></i> ${user.vip || 'VIP0'}`;
      document.getElementById("availableBalance").innerText = (user.balance || 0).toFixed(2) + " USDT";
    }

    async function submitWithdrawRequest() {
      const amount = parseFloat(document.getElementById("withdrawAmount").value);
      const address = document.getElementById("withdrawAddress").value.trim();

      if (!amount || amount <= 0) {
        showCustomToast("يرجى إدخال مبلغ صحيح للسحب.", false);
        return;
      }
      if (!address) {
        showCustomToast("يرجى إدخال عنوان المحفظة.", false);
        return;
      }

      const user = await getCurrentUser();
      if (amount > user.balance) {
        showCustomToast("رصيدك المتاح لا يكفي لإتمام عملية السحب.", false);
        return;
      }

      const db = await getCloudDB();

      const requestObj = {
        id: generateTransactionId(),
        username: user.username,
        amount: amount,
        address: address,
        type: "withdraw",
        status: "pending",
        date: new Date().toLocaleString('ar-EG')
      };

      user.balance -= amount;
      if (!db.withdrawRequests) db.withdrawRequests = [];
      db.withdrawRequests.push(requestObj);

      if (!user.history) user.history = [];
      user.history.unshift({
        id: requestObj.id,
        type: "withdraw",
        title: "طلب سحب قيد المراجعة",
        amount: amount,
        status: "pending",
        date: requestObj.date
      });

      const userIndex = db.users.findIndex(u => u.username === user.username);
      if (userIndex !== -1) {
        db.users[userIndex] = user;
      }

      const success = await updateCloudDB(db);
      if (success) {
        showCustomToast("تم إرسال طلب السحب بنجاح وهو قيد المراجعة من الإدارة.", true);
        setTimeout(() => {
          window.location.href = "profile.html";
        }, 1500);
      } else {
        showCustomToast("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.", false);
      }
    }

    initPage();
  </script>
</body>
</html>
