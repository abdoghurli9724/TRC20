<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mall - سحب أرباح</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b1021;
      --card-bg: #151b31;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(11, 16, 33, 0.9);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    .main-container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
    
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
    .form-control {
      width: 100%; background: #0f172a; border: 1px solid var(--border-color);
      padding: 12px; border-radius: var(--radius-sm); color: var(--text-main); font-size: 1rem; outline: none;
    }
    .form-control:focus { border-color: var(--accent-blue); }

    .submit-btn {
      width: 100%; background: var(--accent-green); color: white; border: none;
      padding: 14px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .alert-box {
      padding: 12px; border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 0.9rem; display: none; text-align: center;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
  </style>
</head>
<body>

  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='index.html'">
      <i class="bi bi-arrow-right" style="font-size: 1.2rem;"></i>
      <span style="font-weight: 700;">سحب الأرباح</span>
    </div>
  </header>

  <div class="main-container">
    <div class="form-card">
      <div id="alertBox" class="alert-box"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 15px; border: 1px solid var(--border-color);">
        <span style="color: var(--text-muted); font-size: 0.85rem;">الرصيد المتاح للسحب:</span>
        <span id="displayAvailableBalance" style="color: var(--accent-green); font-weight: 700; font-size: 1.1rem;">$0.00</span>
      </div>

      <form id="withdrawForm">
        <div class="form-group">
          <label>مبلغ السحب ($)</label>
          <input type="number" id="withdrawAmount" class="form-control" placeholder="الحد الأدنى 2$" min="2" step="any" required>
        </div>
        
        <div class="form-group">
          <label>عنوان المحفظة (USDT - TRC20)</label>
          <input type="text" id="withdrawAddress" class="form-control" placeholder="أدخل عنوان محفظتك لاستلام الأرباح" required>
        </div>

        <div class="form-group">
          <label>كلمة مرور الحساب</label>
          <input type="password" id="securityPassword" class="form-control" placeholder="أدخل كلمة المرور للتأكيد" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="btnText">تقديم طلب السحب</span>
          <span id="btnSpinner" style="display: none;"><i class="bi bi-arrow-repeat" style="animation: spin 1s linear infinite; display: inline-block;"></i> جاري المعالجة...</span>
        </button>
      </form>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    let currentUserObj = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('activeUsername');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      const db = await getCloudDB();
      currentUserObj = db.users.find(u => u.username === activeUsername);
      if (!currentUserObj) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('displayAvailableBalance').innerText = '$' + parseFloat(currentUserObj.balance || 0).toFixed(2);
    });

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert-box alert-${type}`;
      box.innerText = msg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      const address = document.getElementById('withdrawAddress').value.trim();
      const password = document.getElementById('securityPassword').value;

      const currentBalance = parseFloat(currentUserObj.balance || 0);

      if (isNaN(amount) || amount < 2) {
        showAlert('الحد الأدنى للسحب هو $2.00', 'error');
        return;
      }

      if (amount > currentBalance) {
        showAlert(`رصيدك المتاح ($${currentBalance.toFixed(2)}) لا يكفي لإتمام هذا السحب`, 'error');
        return;
      }

      if (!address || address.length < 15) {
        showAlert('يرجى كتابة عنوان محفظة TRC20 صحيح', 'error');
        return;
      }

      if (password !== currentUserObj.password) {
        showAlert('كلمة المرور غير صحيحة', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const db = await getCloudDB();
        const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);

        if (userIndex !== -1) {
          const user = db.users[userIndex];
          // خصم المبلغ فوراً من الرصيد المتاح للمستخدم
          user.balance = parseFloat(user.balance || 0) - amount;

          if (!db.records) db.records = [];
          const recordId = 'WIT-' + Math.floor(100000 + Math.random() * 900000);
          const currentDate = new Date().toLocaleString('ar-EG');

          // إضافة طلب السحب للقائمة العامة للأدمن
          db.records.unshift({
            id: recordId,
            type: "سحب",
            username: user.username,
            amount: amount,
            address: address,
            status: "قيد الانتظار",
            date: currentDate
          });

          if (!user.history) user.history = [];
          user.history.unshift({
            id: recordId,
            type: "withdraw",
            title: "طلب سحب أرباح (USDT-TRC20)",
            amount: -amount,
            address: address,
            status: "pending",
            date: currentDate
          });

          const success = await updateCloudDB(db);

          if (success) {
            currentUserObj = user;
            document.getElementById('displayAvailableBalance').innerText = '$' + user.balance.toFixed(2);
            showAlert('تم تقديم طلب السحب بنجاح!', 'success');
            document.getElementById('withdrawForm').reset();
            
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 2000);
          } else {
            showAlert('حدث خطأ أثناء الاتصال بالسحابة، حاول ثانية.', 'error');
            submitBtn.disabled = false;
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';
          }
        }
      } catch (error) {
        console.error('Withdraw Error:', error);
        showAlert('فشل الاتصال بالسيرفر، يرجى المحاولة لاحقاً', 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
