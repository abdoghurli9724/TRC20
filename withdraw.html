<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <a href="profile.html" style="color: #0f172a; text-decoration: none; font-size: 20px;"><i class="fa-solid fa-arrow-right"></i></a>
        <span class="brand-title">سحب الأرباح</span>
        <div></div>
    </div>

    <form onsubmit="submitWithdraw(event)" class="user-card">
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 13px; color: #475569; margin-bottom: 5px;">المبلغ المراد سحبه (USDT)</label>
            <input type="number" step="0.01" placeholder="أقل مبلغ للسحب 1.00" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 13px; color: #475569; margin-bottom: 5px;">عنوان محفظتك (USDT TRC20)</label>
            <input type="text" placeholder="أدخل عنوان المحفظة" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 13px; color: #475569; margin-bottom: 5px;">كلمة مرور السحب</label>
            <input type="password" placeholder="أدخل كلمة المرور" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none;">
        </div>
        <button type="submit" style="background: #d1c4e9; color: #4a148c; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold;">تاكيد طلب السحب</button>
    </form>
</div>

<script>
function submitWithdraw(e) {
    e.preventDefault();
    alert('تم تقديم طلب السحب بنجاح، سيتم معالجة الطلب خلال دقائق.');
    window.location.href = 'profile.html';
}
</script>
</body>
</html>
