<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - مستويات VIP والترقية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="profile.css">
  
  <style>
    .vip-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeIn 0.2s ease-in-out;
    }
    .vip-modal-content {
        background: linear-gradient(145deg, #161616, #1c1c1c);
        border: 1px solid rgba(243, 156, 18, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(243, 156, 18, 0.1);
        width: 85%;
        max-width: 380px;
        padding: 24px;
        border-radius: 16px;
        text-align: center;
        color: #ffffff;
        font-family: 'Cairo', sans-serif;
        animation: scaleUp 0.2s ease-in-out;
    }
    .vip-modal-icon {
        font-size: 32px;
        margin-bottom: 12px;
    }
    .vip-modal-content h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
        color: #f39c12;
    }
    .vip-modal-content p {
        margin: 0 0 20px 0;
        font-size: 14px;
        color: #cccccc;
        line-height: 1.6;
    }
    .vip-modal-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
    }
    .vip-btn {
        flex: 1;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
    }
    .vip-btn-confirm {
        background: linear-gradient(135deg, #f39c12, #d68910);
        color: #111111;
    }
    .vip-btn-confirm:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }
    .vip-btn-cancel {
        background-color: #2b2b2b;
        color: #ffffff;
        border: 1px solid #444444;
    }
    .vip-btn-cancel:hover {
        background-color: #383838;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes scaleUp {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <header class="app-header">
    <div class="logo-area">
      <i class="bi bi-award-fill" style="color: var(--accent-gold);"></i>
      عضويات <span>VIP</span>
    </div>
    <div class="vip-badge" id="currentVipBadge" style="background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 6px;">
      <i class="bi bi-award-fill"></i>
      <span id="headerVipText">VIP0</span>
    </div>
  </header>

  <div class="container">
    <!-- Info Banner -->
    <div class="glass-card" style="text-align: center; background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(59,130,246,0.1)); border: 1px solid rgba(245,158,11,0.2);">
      <h3 style="color: var(--accent-gold); font-size: 1.05rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <i class="bi bi-gem"></i> ترقية مستوى العضوية
      </h3>
      <p style="color: var(--text-muted); font-size: 0.8rem; line-height: 1.6;">
        قم بترقية مستواك لزيادة عدد المهام والتقييمات اليومية وتحقيق عوائد وأرباح أعلى بشكل سنوي!
      </p>
    </div>

    <!-- Balance Summary Bar -->
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 20px; margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem; color: var(--text-muted);">إجمالي الإيداع (للترقيات):</span>
        <span style="font-size: 1.2rem; font-weight: 900; color: var(--accent-gold);" id="userTotalDepositText">$0.00</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;">
        <span style="font-size: 0.8rem; color: var(--text-muted);">الرصيد المتاح (للسحب والأرباح):</span>
        <span style="font-size: 0.95rem; font-weight: 700; color: var(--accent-green);" id="userBalanceText">$0.00</span>
      </div>
    </div>

    <!-- VIP Levels List Container -->
    <main id="vipCardsContainer">
      <!-- VIP Cards Will Be Dynamically Injected Here -->
    </main>
  </div>

  <!-- Custom Modal HTML Structure -->
  <div id="customVipModal" class="vip-modal-overlay" style="display: none;">
      <div class="vip-modal-content">
          <div class="vip-modal-icon" id="vipModalIcon">⚠️</div>
          <h3 id="vipModalTitle">تنبيه</h3>
          <p id="vipModalText">محتوى الرسالة هنا</p>
          <div class="vip-modal-buttons" id="vipModalButtonsContainer">
              <button id="vipModalCancelBtn" class="vip-btn vip-btn-cancel">إلغاء</button>
              <button id="vipModalConfirmBtn" class="vip-btn vip-btn-confirm">موافق</button>
          </div>
      </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="bi bi-house-fill"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="bi bi-check2-square"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="bi bi-people-fill"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item active">
      <i class="bi bi-award-fill"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- VIP Controller Script -->
  <script>
    let currentUserObj = null;
    let cloudVipLevels = [];

    function showCustomModal(title, text, icon = "⚠️", showCancel = true, confirmText = "موافق", onConfirm = null) {
        const modal = document.getElementById('customVipModal');
        document.getElementById('vipModalTitle').innerText = title;
        document.getElementById('vipModalText').innerText = text;
        document.getElementById('vipModalIcon').innerText = icon;

        const cancelBtn = document.getElementById('vipModalCancelBtn');
        const confirmBtn = document.getElementById('vipModalConfirmBtn');
        
        confirmBtn.innerText = confirmText;
        cancelBtn.style.display = showCancel ? 'block' : 'none';

        modal.style.display = 'flex';

        const newConfirmBtn = confirmBtn.cloneNode(true);
        const newCancelBtn = cancelBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
        cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

        newConfirmBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            if (onConfirm) onConfirm();
        });

        newCancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      try {
        currentUserObj = await getCurrentUser();
        if (!currentUserObj) {
          logoutUser();
          return;
        }

        const db = await getCloudDB();
        if (db && db.vipPackages && db.vipPackages.length > 0) {
          cloudVipLevels = db.vipPackages;
        } else {
          cloudVipLevels = [
            { id: "VIP0", name: "عضوية VIP0 (تجريبي)", price: 0, tasks: 2, taskProfit: 0.25, dailyIncome: 0.50, monthlyIncome: 15.00, annualIncome: 180.00, referralCommission: 0 },
            { id: "VIP1", name: "عضوية VIP1 الاحترافية", price: 20, tasks: 6, taskProfit: 3.50, dailyIncome: 21.00, monthlyIncome: 630.00, annualIncome: 7560.00, referralCommission: 10 },
            { id: "VIP2", name: "عضوية VIP2 الذهبية", price: 50, tasks: 6, taskProfit: 5.00, dailyIncome: 30.00, monthlyIncome: 900.00, annualIncome: 10800.00, referralCommission: 15 },
            { id: "VIP3", name: "عضوية VIP3 الماسية", price: 100, tasks: 10, taskProfit: 8.00, dailyIncome: 80.00, monthlyIncome: 2400.00, annualIncome: 28800.00, referralCommission: 25 }
          ];
        }

        renderVipPage();
      } catch (error) {
        console.error('Error fetching VIP page data:', error);
      }
    });

    function renderVipPage() {
      const userVip = currentUserObj.vip || "VIP0";
      const userBalance = parseFloat(currentUserObj.balance || 0);
      const userTotalDeposit = parseFloat(currentUserObj.depositBalance || currentUserObj.totalDeposit || 0);

      document.getElementById('headerVipText').innerText = userVip;
      document.getElementById('userBalanceText').innerText = '$' + userBalance.toFixed(2);
      document.getElementById('userTotalDepositText').innerText = '$' + userTotalDeposit.toFixed(2);

      const container = document.getElementById('vipCardsContainer');
      container.innerHTML = '';

      cloudVipLevels.forEach((level, index) => {
        const levelId = level.id || `VIP${index}`;
        const isCurrentLevel = (userVip === levelId || userVip === level.name);

        const card = document.createElement('div');
        card.className = `vip-tier-card ${isCurrentLevel ? 'active-level' : ''}`;
        if (isCurrentLevel) {
          card.style.borderColor = 'var(--accent-gold)';
          card.style.boxShadow = '0 0 25px rgba(245, 158, 11, 0.25)';
        }

        const headerClasses = ["vip-0", "vip-1", "vip-2", "vip-3", "vip-4", "vip-5"];
        const headerClass = headerClasses[index % headerClasses.length];

        const monthlyInc = parseFloat(level.monthlyIncome || 0);
        const annualInc = level.yearlyIncome ? parseFloat(level.yearlyIncome) : (level.annualIncome ? parseFloat(level.annualIncome) : (monthlyInc * 12));

        card.innerHTML = `
          <div class="vip-header ${headerClass}">
            <span style="display: flex; align-items: center; gap: 8px;">
              <i class="bi bi-award-fill"></i> ${level.name || levelId}
            </span>
            <span>$${parseFloat(level.price || 0).toFixed(2)}</span>
          </div>
          <div class="vip-body">
            <div class="vip-feature-row">
              <span><i class="bi bi-list-check" style="color:var(--accent-blue);"></i> المهام اليومية:</span>
              <span>${level.tasks || level.dailyTasks || 0} مهام</span>
            </div>
            <div class="vip-feature-row">
              <span><i class="bi bi-coin" style="color:var(--accent-gold);"></i> ربح المهمة:</span>
              <span>$${parseFloat(level.taskProfit || 0).toFixed(2)}</span>
            </div>
            <div class="vip-feature-row">
              <span><i class="bi bi-graph-up-arrow" style="color:var(--accent-green);"></i> الإيراد اليومي:</span>
              <span style="color: var(--accent-green);">$${parseFloat(level.dailyIncome || 0).toFixed(2)}</span>
            </div>
            <div class="vip-feature-row">
              <span><i class="bi bi-wallet2" style="color:var(--accent-gold);"></i> الإيراد الشهري:</span>
              <span style="color: var(--accent-gold);">$${monthlyInc.toFixed(2)}</span>
            </div>
            <div class="vip-feature-row">
              <span><i class="bi bi-calendar-check" style="color:var(--accent-gold);"></i> إيرادات السنة:</span>
              <span style="color: var(--accent-gold); font-weight: bold;">$${annualInc.toFixed(2)}</span>
            </div>
            <button class="btn-primary" 
                    id="btn_upgrade_${index}"
                    onclick="handleUpgrade('${levelId}', ${parseFloat(level.price || 0)})" 
                    style="margin-top: 20px; ${isCurrentLevel ? 'background: rgba(255,255,255,0.1); color: var(--text-muted); cursor: not-allowed; box-shadow: none;' : ''}"
                    ${isCurrentLevel ? 'disabled' : ''}>
              ${isCurrentLevel ? 'مستواك الحالي' : 'ترقية الآن مقابل $' + parseFloat(level.price || 0)}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function handleUpgrade(targetVipId, targetPrice) {
      if (!currentUserObj) return;

      const currentVip = currentUserObj.vip || "VIP0";
      const currentDeposit = parseFloat(currentUserObj.depositBalance || currentUserObj.totalDeposit || 0);

      let refundAmount = 0;
      const currentPkg = cloudVipLevels.find(p => p.id === currentVip || p.name === currentVip || (p.id && p.id.toLowerCase() === currentVip.toLowerCase()));

      if (currentVip !== "VIP0") {
        if (currentPkg && currentPkg.price !== undefined) {
          refundAmount = parseFloat(currentPkg.price);
        } else {
          const emergencyPrices = { "VIP1": 20, "VIP2": 50, "VIP3": 100, "VIP4": 150, "VIP5": 200, "VIP6": 300, "VIP7": 200 };
          refundAmount = emergencyPrices[currentVip] || 0;
        }
      }

      if (currentDeposit < targetPrice) {
        showCustomModal(
          "تنبيه الرصيد",
          `إجمالي رصيد الإيداع لديك ($${currentDeposit.toFixed(2)}) لا يكفي لشراء الباقة الجديدة المطلوبة ($${targetPrice}). هل ترغب بفتح صفحة الإيداع الآن؟`,
          "💡",
          true,
          "نعم، فتح الإيداع",
          () => {
            window.location.href = 'deposit.html';
          }
        );
        return;
      }

      let confirmMessage = `هل أنت متأكد من الترقية إلى مستوى ${targetVipId} مقابل $${targetPrice}؟ (سيتم إعادة قيمة اشتراكك السابق بقيمة $${refundAmount} إلى رصيدك المتاح).`;

      showCustomModal(
        "تأكيد الترقية",
        confirmMessage,
        "👑",
        true,
        "نعم، تفعيل الآن",
        async () => {
          try {
            const db = await getCloudDB();
            const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);

            if (userIndex !== -1) {
              const user = db.users[userIndex];

              if (user.balance === undefined) user.balance = 0;
              if (user.depositBalance === undefined) user.depositBalance = user.totalDeposit || 0;

              // 1. خصم سعر الباقة الجديدة من رصيد الإيداع
              let userDep = parseFloat(user.depositBalance);
              userDep -= targetPrice;
              if (userDep < 0) userDep = 0;
              user.depositBalance = parseFloat(userDep.toFixed(2));
              user.totalDeposit = user.depositBalance;

              // 2. إعادة وإضافة قيمة الاشتراك السابق إلى "الرصيد المتاح" (Balance)
              let userBal = parseFloat(user.balance);
              if (currentVip !== "VIP0") {
                if (refundAmount <= 0 && currentPkg) {
                  refundAmount = parseFloat(currentPkg.price || 0);
                }
                userBal += refundAmount;
              }
              user.balance = parseFloat(userBal.toFixed(2));

              user.vip = targetVipId;
              user.vipStartDate = new Date().toISOString();

              if (!user.history) user.history = [];

              if (currentVip !== "VIP0" && refundAmount > 0) {
                user.history.unshift({
                  id: generateTransactionId(),
                  type: "refund",
                  title: `إعادة أموال الاشتراك السابق (${currentVip}) للرصيد المتاح`,
                  amount: refundAmount,
                  status: "completed",
                  date: new Date().toLocaleString('ar-EG')
                });
              }

              user.history.unshift({
                id: generateTransactionId(),
                type: "upgrade",
                title: `ترقية العضوية إلى ${targetVipId}`,
                amount: -targetPrice,
                status: "completed",
                date: new Date().toLocaleString('ar-EG')
              });

              // 3. --- إضافة عمولة الدعوة تلقائياً للمُحيل (invitedBy) ---
              if (user.invitedBy) {
                const referrerIndex = db.users.findIndex(u => u.username === user.invitedBy);
                if (referrerIndex !== -1) {
                  const referrer = db.users[referrerIndex];
                  
                  // البحث عن الباقة المستهدفة لمعرفة عمولة الإحالة المحددة من الأدمن
                  const targetPkg = cloudVipPackages.find(p => p.id === targetVipId || p.name === targetVipId);
                  const commissionEarned = targetPkg ? parseFloat(targetPkg.referralCommission || 0) : 0;

                  if (commissionEarned > 0) {
                    if (referrer.balance === undefined) referrer.balance = 0;
                    referrer.balance = parseFloat((parseFloat(referrer.balance) + commissionEarned).toFixed(2));

                    if (!referrer.history) referrer.history = [];
                    referrer.history.unshift({
                      id: generateTransactionId(),
                      type: "referral_commission",
                      title: `عمولة ترقية العضو المدعو (${user.username}) إلى ${targetVipId}`,
                      amount: commissionEarned,
                      status: "completed",
                      date: new Date().toLocaleString('ar-EG')
                    });
                  }
                }
              }

              const success = await updateCloudDB(db);

              if (success) {
                currentUserObj = user;
                renderVipPage();
                showCustomModal("نجاح الترقية", `مبروك! تم إعادة مبلغ $${refundAmount} إلى رصيدك المتاح وترقية حسابك بنجاح إلى مستوى ${targetVipId}.`, "🎉", false, "حسناً");
              } else {
                alert('حدث خطأ أثناء معالجة الترقية في السحابة، يرجى إعادة المحاولة.');
                renderVipPage();
              }
            }
          } catch (error) {
            console.error('Upgrade Error:', error);
            alert('فشل الاتصال بالسيرفر، يرجى المحاولة لاحقاً');
            renderVipPage();
          }
        }
      );
    }
  </script>
</body>
</html>
