<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية مستويات VIP - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding-bottom: 90px; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }

        /* رأس الصفحة */
        .vip-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .vip-header i { font-size: 36px; color: #f59e0b; margin-bottom: 8px; }
        .vip-header h2 { font-size: 20px; font-weight: 800; color: #f8fafc; }
        .vip-header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        /* كارت مستوى VIP */
        .vip-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .vip-card.active-level {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }

        .vip-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .vip-title-box { display: flex; align-items: center; gap: 10px; }
        .vip-title-box i { font-size: 22px; color: #f59e0b; }
        .vip-name { font-size: 16px; font-weight: 800; color: #f8fafc; }
        .vip-price { font-size: 18px; font-weight: 800; color: #38bdf8; }

        .vip-features { list-style: none; margin-bottom: 20px; }
        .vip-features li {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .vip-features li i { color: #10b981; font-size: 14px; }

        /* أزرار الاشتراك */
        .btn-join {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.2s ease;
        }
        .btn-join:active { transform: scale(0.97); }

        .btn-current {
            width: 100%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: default;
            text-align: center;
        }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); display: flex; justify-content: space-around; align-items: center; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: #38bdf8; }

        /* Toast Notifications */
        #toastBox { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { background: #1e293b; color: #fff; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-right: 4px solid #38bdf8; font-size: 13px; }
        .toast.success { border-right-color: #10b981; }
        .toast.error { border-right-color: #ef4444; }
    </style>
</head>
<body>

<div id="toastBox"></div>

<div class="container">
    <div class="vip-header">
        <i class="fa-solid fa-crown"></i>
        <h2>مستويات العضوية VIP</h2>
        <p>قم بترقية مستواك لفتح مهام يومية ذات أرباح أعلى وضاعف دخلك</p>
    </div>

    <div id="vipContainer">جاري تحميل مستويات VIP...</div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>المهام</span></a>
    <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>الفريق</span></a>
    <a href="vip.html" class="nav-item active"><i class="fa-solid fa-crown"></i><span>VIP</span></a>
</div>

<script src="db.js"></script>
<script>
    const vipDataList = {
        'VIP0': {
            name: 'VIP0',
            price: 5,
            dailyTasks: 2,
            taskReward: 0.25,
            dailyIncome: 0.50,
            validity: 'سنة واحدة'
        },
        'VIP1': {
            name: 'VIP1',
            price: 20,
            dailyTasks: 3,
            taskReward: 0.80,
            dailyIncome: 2.40,
            validity: 'سنة واحدة'
        },
        'VIP2': {
            name: 'VIP2',
            price: 50,
            dailyTasks: 3,
            taskReward: 2.50,
            dailyIncome: 7.50,
            validity: 'سنة واحدة'
        },
        'VIP3': {
            name: 'VIP3',
            price: 150,
            dailyTasks: 2,
            taskReward: 8.00,
            dailyIncome: 16.00,
            validity: 'سنة واحدة'
        }
    };

    document.addEventListener("DOMContentLoaded", async function() {
        let currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            currentUser = 'demo';
            localStorage.setItem('currentUser', currentUser);
        }
        await renderVipLevels();
    });

    function showToast(msg, type = 'info') {
        const toastBox = document.getElementById('toastBox');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        let icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info');
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
        toastBox.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    async function renderVipLevels() {
        const currentUser = localStorage.getItem('currentUser');
        const db = await getCloudDB();
        let u = db.usersDB?.[currentUser] || { vip: 'VIP0' };
        let userVip = u.vip || 'VIP0';

        const container = document.getElementById('vipContainer');
        container.innerHTML = '';

        Object.keys(vipDataList).forEach(levelKey => {
            let info = vipDataList[levelKey];
            let isCurrent = (userVip === levelKey);

            let card = document.createElement('div');
            card.className = `vip-card ${isCurrent ? 'active-level' : ''}`;

            card.innerHTML = `
                <div class="vip-card-header">
                    <div class="vip-title-box">
                        <i class="fa-solid fa-gem"></i>
                        <span class="vip-name">${info.name}</span>
                    </div>
                    <div class="vip-price">$${info.price.toFixed(2)}</div>
                </div>
                <ul class="vip-features">
                    <li><i class="fa-solid fa-circle-check"></i> عدد المهام اليومية: ${info.dailyTasks} مهام</li>
                    <li><i class="fa-solid fa-circle-check"></i> عمولة التقييم الواحد: $${info.taskReward.toFixed(2)}</li>
                    <li><i class="fa-solid fa-circle-check"></i> الدخل اليومي المتوقع: $${info.dailyIncome.toFixed(2)}</li>
                    <li><i class="fa-solid fa-circle-check"></i> صلاحية الرتبة: ${info.validity}</li>
                </ul>
                ${isCurrent ? `
                    <div class="btn-current"><i class="fa-solid fa-check-circle"></i> رتبتك الحالية</div>
                ` : `
                    <button class="btn-join" onclick="buyVipLevel('${levelKey}',${info.price})">انضم الآن</button>
                `}
            `;
            container.appendChild(card);
        });
    }

    async function buyVipLevel(levelKey, price) {
        const currentUser = localStorage.getItem('currentUser');
        showToast('الرجاء الانتظار...', 'info');

        try {
        let db = await getCloudDB();
        if (!db || !db.usersDB || !db.usersDB[currentUser]) {
            showToast('حدث خطأ في تحميل بيانات حسابك، أعد المحاولة', 'error');
            return;
        }

        let u = db.usersDB[currentUser];

        // تحويل الرصيد إلى رقم برمجياً بشكل صارم
        let currentBalance = Number(u.balance);
        if (isNaN(currentBalance)) {
            currentBalance = 0;
        }

        // فحص حاسم للرصيد
        if (currentBalance < price) {
            showToast(`رصيدك غير كافٍ! يجب عليك شحن رصيدك أولاً. الرصيد الحالي: $${currentBalance.toFixed(2)}`, 'error');
            return; // الخروج المباشر دون تنفيذ الترقية
        }

        await new Promise(res => setTimeout(res, 1200));

        // اقتطاع السعر وتفعيل الرتبة
        u.balance = currentBalance - price;
        u.vip = levelKey;

        // إعداد تاريخ الصلاحية لمدة سنة كاملة
        let expiryDate = new Date();
        expiryDate.setFullYear(expiryDate.getFullYear() + 1);
        u.vipExpiry = expiryDate.toISOString();

        if (!u.history) u.history = [];
        u.history.unshift({
            type: 'ترقية',
            amount: `-$${price.toFixed(2)}`,
            title: `اشتراك في رتبة ${levelKey} (صالحة لمدة سنة)`,
            date: new Date().toLocaleString('ar-EG')
        });

        await updateCloudDB(db);

        showToast(`تم الاشتراك بنجاح! تم تفعيل رتبة ${levelKey} لمدة سنة كاملة.`, 'success');
        await renderVipLevels();

    } catch (err) {
        console.error(err);
        showToast('حدث خطأ أثناء معالجة الطلب، حاول مجدداً', 'error');
    }
}

</script>
</body>
</html>
