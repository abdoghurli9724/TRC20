<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - مستويات VIP والترقية</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-crown" style="color: var(--accent-gold);"></i>
      عضويات <span>VIP</span>
    </div>
    <div class="vip-badge" id="currentVipBadge">
      <i class="fa-solid fa-crown"></i>
      <span id="headerVipText">VIP0</span>
    </div>
  </header>

  <!-- Info Banner -->
  <div style="margin: 0 20px 20px 20px; background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(59,130,246,0.15)); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--accent-gold); text-align: center;">
    <h3 style="color: var(--accent-gold); font-size: 1.1rem; margin-bottom: 6px;">
      <i class="fa-solid fa-gem" style="margin-left: 6px;"></i>ترقية مستوى العضوية
    </h3>
    <p style="color: var(--text-secondary); font-size: 0.85rem; line-height: 1.5;">
      قم بترقية مستواك لزيادة عدد المهام والتقييمات اليومية وتحقيق عوائد وأرباح أعلى بشكل يومي!
    </p>
  </div>

  <!-- Balance Summary Bar -->
  <div style="margin: 0 20px 20px 20px; background-color: var(--bg-card); padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 0.85rem; color: var(--text-secondary);">رصيدك المتاح حالياً:</span>
    <span style="font-size: 1.1rem; font-weight: 800; color: var(--accent-green);" id="userBalanceText">$0.00</span>
  </div>

  <!-- VIP Levels List Container -->
  <main id="vipCardsContainer">
    <!-- VIP Cards Will Be Dynamically Injected Here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="fa-solid fa-list-check"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item active">
      <i class="fa-solid fa-crown"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- VIP Controller Script -->
  <script>
    // VIP Membership Definitions
    const VIP_LEVELS = [
      {
        id: "VIP0",
        title: "عضوية VIP0 (مجانية)",
        price: 0,
        dailyTasks: 2,
        taskReward: 0.25,
        dailyProfit: 0.50,
        monthlyProfit: 15.00,
        badgeColor: "#9ca3af"
      },
      {
        id: "VIP1",
        title: "عضوية VIP1 الفضية",
        price: 20,
        dailyTasks: 4,
        taskReward: 1.25,
        dailyProfit: 5.00,
        monthlyProfit: 150.00,
        badgeColor: "#3b82f6"
      },
      {
        id: "VIP2",
        title: "عضوية VIP2 الذهبية",
        price: 50,
        dailyTasks: 6,
        taskReward: 3.50,
        dailyProfit: 21.00,
        monthlyProfit: 630.00,
        badgeColor: "#f59e0b"
      },
      {
        id: "VIP3",
        title: "عضوية VIP3 الماسية",
        price: 150,
        dailyTasks: 10,
        taskReward: 8.00,
        dailyProfit: 80.00,
        monthlyProfit: 2400.00,
        badgeColor: "#10b981"
      }
    ];

    let currentUserObj = null;

    // Load User Data & Render VIP Cards
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      try {
        currentUserObj = await getCurrentUser();
        if (!currentUserObj) {
          logoutUser();
          return;
        }

        renderVipPage();

      } catch (error) {
        console.error('Error fetching VIP page data:', error);
      }
    });

    // Render VIP Cards UI
    function renderVipPage() {
      const userVip = currentUserObj.vip || "VIP0";
      const userBalance = parseFloat(currentUserObj.balance || 0);

      document.getElementById('headerVipText').innerText = userVip;
      document.getElementById('userBalanceText').innerText = '$' + userBalance.toFixed(2);

      const container = document.getElementById('vipCardsContainer');
      container.innerHTML = '';

      VIP_LEVELS.forEach(level => {
        const isCurrentLevel = (userVip === level.id);

        const card = document.createElement('div');
        card.className = `vip-card ${isCurrentLevel ? 'active-level' : ''}`;
        card.innerHTML = `
          <div class="vip-header">
            <div class="vip-title" style="color: ${level.badgeColor};">
              <i class="fa-solid fa-crown" style="margin-left: 6px;"></i>${level.title}
            </div>
            <div class="vip-price">$${level.price.toFixed(2)}</div>
          </div>
          <div class="vip-body">
            <div class="vip-feature">
              <span>المهام اليومية:</span>
              <span class="val">${level.dailyTasks} مهام</span>
            </div>
            <div class="vip-feature">
              <span>ربح المهمة الواحدة:</span>
              <span class="val">$${level.taskReward.toFixed(2)}</span>
            </div>
            <div class="vip-feature">
              <span>الإيراد اليومي المتوقع:</span>
              <span class="val" style="color: var(--accent-green);">$${level.dailyProfit.toFixed(2)}</span>
            </div>
            <div class="vip-feature">
              <span>الإيراد الشهري المتوقع:</span>
              <span class="val" style="color: var(--accent-green);">$${level.monthlyProfit.toFixed(2)}</span>
            </div>
          </div>
          <div class="vip-footer">
            <button class="vip-buy-btn ${isCurrentLevel ? 'current' : ''}" 
                    id="btn_upgrade_${level.id}"
                    onclick="handleUpgrade('${level.id}', ${level.price})" 
                    ${isCurrentLevel ? 'disabled' : ''}>
              ${isCurrentLevel ? 'مستواك الحالي' : 'ترقية الان مقابل $' + level.price}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Handle VIP Upgrade Request
    async function handleUpgrade(targetVipId, price) {
      if (!currentUserObj) return;

      const currentBalance = parseFloat(currentUserObj.balance || 0);

      if (currentBalance < price) {
        if (confirm(`رصيدك الحالي ($${currentBalance.toFixed(2)}) لا يكفي للترقية إلى ${targetVipId} ($${price}). هل ترغب بفتح صفحة الإيداع الآن؟`)) {
          window.location.href = 'deposit.html';
        }
        return;
      }

      if (!confirm(`هل أنت تأكد من الترقية إلى مستوى ${targetVipId} مقابل خصم $${price} من رصيدك المتاح؟`)) {
        return;
      }

      const btn = document.getElementById(`btn_upgrade_${targetVipId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:16px; height:16px;"></span> جاري الترقية...';
      }

      try {
        const db = await getCloudDB();
        const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);

        if (userIndex !== -1) {
          const user = db.users[userIndex];

          // Deduct Balance & Update VIP Level
          user.balance = parseFloat(user.balance || 0) - parseFloat(price);
          user.vip = targetVipId;

          if (!user.history) user.history = [];

          // Add transaction record
          user.history.unshift({
            id: generateTransactionId(),
            type: "upgrade",
            title: `ترقية العضوية إلى ${targetVipId}`,
            amount: -parseFloat(price),
            status: "completed",
            date: new Date().toLocaleString('ar-EG')
          });

          // Update Cloud Storage
          const success = await updateCloudDB(db);

          if (success) {
            currentUserObj = user;
            renderVipPage();
            alert(`مبروك! تم ترقية حسابك بنجاح إلى مستوى ${targetVipId}. يمكنك الآن تنفيذ مهام أعلى ربحاً.`);
          } else {
            alert('حدث خطأ أثناء معالجة الترقية في السحابة، يرجى إعادة المحاولة.');
            renderVipPage();
          }
        }
      } catch (error) {
        console.error('Upgrade Error:', error);
        alert('حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً');
        renderVipPage();
      }
    }
  </script>
</body>
</html>
