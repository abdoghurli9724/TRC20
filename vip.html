<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقية VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #cce7ff; padding: 15px; font-family: system-ui; direction: rtl; }
        .vip-card { background: #fff; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .vip-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .btn-join { background: #0284c7; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<h2 style="margin-bottom: 15px; text-align: center;">قائمة باقات VIP</h2>
<div id="vipList">جاري تحميل الباقات...</div>

<script src="js/config.js"></script>
<script>
    const defaultVips = {
        'VIP1': { price: 20, profit: 2, img: '' },
        'VIP2': { price: 50, profit: 5, img: '' },
        'VIP3': { price: 100, profit: 12, img: '' }
    };

    document.addEventListener("DOMContentLoaded", async function() {
        let serverData = await fetchServerData();
        let offers = serverData.offers || defaultVips;
        const container = document.getElementById('vipList');
        container.innerHTML = '';

        Object.keys(offers).forEach(vip => {
            let item = offers[vip];
            container.innerHTML += `
                <div class="vip-card">
                    <div class="vip-header">
                        <span>${vip}</span>
                        <span style="color: #0284c7;">$${item.price}</span>
                    </div>
                    ${item.img ? `<img src="${item.img}" style="width:100%; border-radius:10px; margin-bottom:10px;">` : ''}
                    <p style="font-size:13px; color:#64748b; margin-bottom:10px;">الربح اليومي: <b>$${item.profit}</b></p>
                    <button class="btn-join" onclick="buyVip('${vip}', ${item.price})">انضم الآن</button>
                </div>
            `;
        });
    });

    async function buyVip(vipLevel, price) {
        const currentUser = localStorage.getItem('currentUser');
        let serverData = await fetchServerData();
        let user = serverData.usersDB[currentUser];

        if (!user) return alert('حدث خطأ، أعد تسجيل الدخول!');

        if ((user.balance || 0) < price) {
            return alert('رصيدك غير كافٍ لتفعيل هذه الباقة! يرجى الشحن أولاً.');
        }

        if (confirm(`هل تريد خصم $${price} لتفعيل مستوى ${vipLevel}؟`)) {
            user.balance -= price;
            user.vipLevel = vipLevel;
            user.lastTaskDate = null; // إعادة تعيين المهام للتجديد

            await updateServerData(serverData);
            alert(`مبروك! تم تفعيل مستوى ${vipLevel} بنجاح.`);
            window.location.href = 'tasks.html';
        }
    }
</script>
</body>
</html>
