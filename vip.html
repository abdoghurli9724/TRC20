<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #cce7ff; min-height: 100vh; padding-bottom: 90px; direction: rtl; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }

        .vip-card { background: #fff; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-join { background: #0284c7; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-joined { background: #10b981; color: white; }

        .bottom-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; max-width: 480px; margin: 0 auto; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid #e2e8f0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; text-align: center; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: #0284c7; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">باقات VIP الاشتراكية</h2>
    <div id="vipContainer"></div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
    <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>المهام</span></a>
    <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>الفريق</span></a>
    <a href="vip.html" class="nav-item active"><i class="fa-solid fa-crown"></i><span>VIP</span></a>
</div>

<script>
    const currentUser = localStorage.getItem('currentUser') || '099999999';

    const packages = [
        { id: 'VIP1', price: 10, dailyProfit: 1.5, taskCount: 2 },
        { id: 'VIP2', price: 30, dailyProfit: 4.5, taskCount: 3 },
        { id: 'VIP3', price: 100, dailyProfit: 16.0, taskCount: 4 },
        { id: 'VIP4', price: 300, dailyProfit: 50.0, taskCount: 5 },
        { id: 'VIP5', price: 1000, dailyProfit: 180.0, taskCount: 6 }
    ];

    function renderVIP() {
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let user = users[currentUser] || {};
        let currentVIP = user.vip || 'VIP0';

        let html = '';
        packages.forEach(pkg => {
            let isCurrent = currentVIP === pkg.id;
            html += `
            <div class="vip-card">
                <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:8px;">
                    <span>${pkg.id}</span>
                    <span style="color:#0284c7;">$${pkg.price}</span>
                </div>
                <p style="font-size:12px; color:#64748b; margin-bottom:10px;">الربح اليومي: $${pkg.dailyProfit} | عدد المهام: ${pkg.taskCount}</p>
                <button class="btn-join ${isCurrent ? 'btn-joined' : ''}" onclick="buyVIP('${pkg.id}', ${pkg.price}, ${pkg.taskCount}, ${pkg.dailyProfit})">
                    ${isCurrent ? 'المستوى مفعل حالياً' : 'انضم الآن'}
                </button>
            </div>`;
        });
        document.getElementById('vipContainer').innerHTML = html;
    }

    function buyVIP(vipId, price, taskCount, dailyProfit) {
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let user = users[currentUser];

        if(!user) return alert('خطأ في جلب بيانات الحساب!');
        if(user.balance < price) {
            return alert(`رصيدك الحالي ($${user.balance.toFixed(2)}) غير كافٍ لتفعيل ${vipId}! يرجى الإيداع أولاً.`);
        }

        if(confirm(`هل أنت تأكد من ترقية حسابك إلى ${vipId} بسعر $${price}؟`)) {
            user.balance -= price;
            user.vip = vipId;
            user.activeTaskCount = taskCount;
            user.taskReward = (dailyProfit / taskCount).toFixed(2);
            
            localStorage.setItem('usersDB', JSON.stringify(users));
            alert(`مبروك! تم تفعيل مستوى ${vipId} وتحديد المهام اليومية بنجاح!`);
            renderVIP();
        }
    }

    document.addEventListener("DOMContentLoaded", renderVIP);
</script>
</body>
</html>
