<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #cce7ff; min-height: 100vh; padding-bottom: 90px; direction: rtl; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }

        .vip-card { background: #fff; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-join { background: #0284c7; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* شريط التنقل السفلي الثابت */
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 9999;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; text-align: center; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: #0284c7; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">باقات VIP</h2>

    <div class="vip-card">
        <div style="display:flex; justify-style:space-between; font-weight:bold; margin-bottom:10px;">
            <span>VIP1</span>
            <span style="color:#0284c7">$20</span>
        </div>
        <p style="font-size:12px; color:#64748b; margin-bottom:10px;">الربح اليومي: $2.00</p>
        <button class="btn-join" onclick="alert('تأكيد الانضمام')">انضم الآن</button>
    </div>
</div>

<!-- الشريط السفلي الثابت -->
<div class="bottom-nav">
