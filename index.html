<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - الرئيسية</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-store" style="color: var(--accent-blue);"></i>
      Virtual <span>Mall</span>
    </div>
    <div class="vip-badge" id="vipHeaderBadge">
      <i class="fa-solid fa-crown"></i>
      <span id="userVipText">VIP0</span>
    </div>
  </header>

  <!-- Scrolling Ticker Notifications Bar -->
  <div class="ticker-container">
    <i class="fa-solid fa-bullhorn"></i>
    <div class="ticker-content" id="tickerContent">
      <!-- Dynamic Ticker Items injected via JS -->
    </div>
  </div>

  <!-- User Balance & Overview Card -->
  <div style="margin: 20px; background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
    <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">الرصيد المتاح حالياً</div>
    <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent-green); margin-bottom: 16px;" id="userBalanceText">$0.00</div>
    
    <!-- Quick Actions Grid (Fixed Layout & Non-clipped text) -->
    <div class="quick-actions-grid">
      <a href="deposit.html" class="action-btn">
        <i class="fa-solid fa-wallet"></i>
        <span>إيداع</span>
      </a>
      <a href="withdraw.html" class="action-btn">
        <i class="fa-solid fa-money-bill-transfer"></i>
        <span>سحب</span>
      </a>
      <a href="profile.html" class="action-btn">
        <i class="fa-solid fa-user-gear"></i>
        <span>حسابي</span>
      </a>
      <a href="records.html" class="action-btn">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>سجلات</span>
      </a>
    </div>
  </div>

  <!-- Announcement / Banner Section -->
  <div style="margin: 0 20px 20px 20px; background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(245,158,11,0.1)); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; text-align: center;">
    <div style="font-weight: 700; font-size: 1rem; margin-bottom: 6px; color: var(--accent-gold);">منصة التقييم الذكي للمنتجات</div>
    <div style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5;">قم بترقية مستواك الآن لزيادة مهامك اليومية ومضاعفة أرباحك السحب الفوري على مدار الساعة.</div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="fa-solid fa-list-check"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item">
      <i class="fa-solid fa-crown"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Custom Modal HTML Structure -->
  <div id="customModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <div class="custom-modal-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <div class="custom-modal-message" id="modalMessageText">نص الرسالة هنا</div>
      <div class="custom-modal-buttons" id="modalButtonsContainer">
        <button class="custom-modal-btn primary" id="modalOkBtn">موافق</button>
      </div>
    </div>
  </div>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Index Logic Script -->
  <script>
    // Custom Modal Alert Function
    function showCustomAlert(message, callback) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalMessageText').innerText = message;
      document.getElementById('modalButtonsContainer').innerHTML = '<button class="custom-modal-btn primary" id="modalOkBtn">موافق</button>';
      modal.classList.add('active');
      
      document.getElementById('modalOkBtn').onclick = function() {
        modal.classList.remove('active');
        if (typeof callback === 'function') callback();
      };
    }

    // Dynamic Fake Ticker Notifications Data
    const tickerMessages = [
      "قام المستخدم (***4921) بسحب مبلغ $150.00 بنجاح",
      "قام المستخدم (***8812) بإيداع مبلغ $50.00 بنجاح",
      "تم ترقية حساب المستخدم (***3319) إلى مستوى VIP2 بنجاح",
      "قام المستخدم (***7024) بسحب مبلغ $320.50 بنجاح",
      "قام المستخدم (***1105) بإيداع مبلغ $100.00 بنجاح",
      "حصل المستخدم (***5542) على عمولة تقييم جديدة بقيمة $8.00"
    ];

    let currentTickerIndex = 0;

    function initTicker() {
      const tickerContainer = document.getElementById('tickerContent');
      if (!tickerContainer) return;

      // Render items
      tickerContainer.innerHTML = '';
      tickerMessages.forEach((msg, idx) => {
        const div = document.createElement('div');
        div.className = `ticker-item ${idx === 0 ? 'active' : ''}`;
        div.innerText = msg;
        tickerContainer.appendChild(div);
      });

      // Rotate every 3.5 seconds
      setInterval(() => {
        const items = tickerContainer.querySelectorAll('.ticker-item');
        if (items.length === 0) return;
        
        items[currentTickerIndex].classList.remove('active');
        currentTickerIndex = (currentTickerIndex + 1) % items.length;
        items[currentTickerIndex].classList.add('active');
      }, 3500);
    }

    // Load User Data on Startup
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      initTicker();

      try {
        const user = await getCurrentUser();
        if (user) {
          document.getElementById('userBalanceText').innerText = `$${parseFloat(user.balance || 0).toFixed(2)}`;
          document.getElementById('userVipText').innerText = user.vip || "VIP0";
        }
      } catch (e) {
        console.error('Error fetching user profile:', e);
      }
    });
  </script>
</body>
</html>
