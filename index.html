<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - الصفحة الرئيسية</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-store" style="color: var(--accent-blue);"></i>
      Virtual<span>Mall</span>
    </div>
    <div class="cart-icon-btn" onclick="window.location.href='tasks.html'">
      <i class="fa-solid fa-cart-shopping"></i>
    </div>
  </header>

  <!-- Ticker Bar -->
  <div class="ticker-bar">
    <div class="ticker-badge">
      <i class="fa-solid fa-bell"></i> سحب جديد
    </div>
    <div class="ticker-content" id="tickerText">
      قام المستخدم 09***432 بسحب $150.00 بنجاح ... قام المستخدم 08***911 بسحب $45.50 بنجاح ... مرحباً بك في منصة VirtualMall الرسمية!
    </div>
  </div>

  <!-- Main Balance Card -->
  <section class="balance-card">
    <div class="user-info-row">
      <div class="username-display" id="displayUsername">
        <i class="fa-solid fa-user-circle" style="margin-left: 6px; color: var(--accent-blue);"></i>
        <span id="usernameText">جاري التحميل...</span>
      </div>
      <div class="vip-badge" id="displayVipRank">
        <i class="fa-solid fa-crown"></i>
        <span id="vipRankText">VIP0</span>
      </div>
    </div>

    <div class="balance-grid">
      <div class="balance-item">
        <span class="balance-label">إجمالي الإيداع</span>
        <span class="balance-value deposit" id="totalDepositVal">$0.00</span>
      </div>
      <div class="balance-item">
        <span class="balance-label">الرصيد المتاح</span>
        <span class="balance-value available" id="availableBalanceVal">$0.00</span>
      </div>
    </div>
  </section>

  <!-- Quick Actions Grid -->
  <section class="quick-actions-grid">
    <a href="deposit.html" class="action-btn">
      <div class="action-icon deposit">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <span class="action-title">إيداع</span>
    </a>

    <a href="withdraw.html" class="action-btn">
      <div class="action-icon withdraw">
        <i class="fa-solid fa-hand-holding-dollar"></i>
      </div>
      <span class="action-title">يسحب</span>
    </a>

    <a href="account.html" class="action-btn">
      <div class="action-icon account">
        <i class="fa-solid fa-sliders"></i>
      </div>
      <span class="action-title">حسابي</span>
    </a>

    <a href="records.html" class="action-btn">
      <div class="action-icon records">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <span class="action-title">سجلات</span>
    </a>
  </section>

  <!-- Logout Strip -->
  <div style="margin: 0 20px 24px 20px;">
    <button id="logoutBtn" style="width: 100%; padding: 12px; background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); border-radius: var(--radius-md); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;">
      <i class="fa-solid fa-right-from-bracket"></i>
      تسجيل الخروج من الحساب
    </button>
  </div>

  <!-- Floating Telegram Support Button -->
  <a href="https://t.me" target="_blank" class="floating-support-btn" title="الدعم الفني">
    <i class="fa-solid fa-paper-plane"></i>
  </a>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="fa-solid fa-list-check"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item">
      <i class="fa-solid fa-crown"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Dashboard Controller Script -->
  <script>
    // Verify Session and Load Cloud Data
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      try {
        // Fetch Live Data from JSONBin Cloud
        const user = await getCurrentUser();

        if (!user) {
          alert('جلسة العمل انتهت أو الحساب غير موجود');
          logoutUser();
          return;
        }

        // Render Dashboard Data
        document.getElementById('usernameText').innerText = user.username;
        document.getElementById('vipRankText').innerText = user.vip || 'VIP0';
        document.getElementById('totalDepositVal').innerText = '$' + parseFloat(user.totalDeposit || 0).toFixed(2);
        document.getElementById('availableBalanceVal').innerText = '$' + parseFloat(user.balance || 0).toFixed(2);

      } catch (error) {
        console.error('Error loading dashboard:', error);
      }
    });

    // Logout Handler
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('هل أنت تأكد من رغبتك في تسجيل الخروج؟')) {
        logoutUser();
      }
    });
  </script>
</body>
</html>
