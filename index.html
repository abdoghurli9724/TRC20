<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية - VirtualMall</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cce7ff;
            min-height: 100vh;
            padding-bottom: 80px;
            direction: rtl;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 15px;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
        }

        .brand-icon {
            width: 35px;
            height: 35px;
            background: #00b0ff;
            color: #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-btn {
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* كارت بيانات المستخدم */
        .user-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .vip-badge {
            background: #fef08a;
            color: #854d0e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-phone {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: #fde047;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #713f12;
        }

        .balance-container {
            display: flex;
            justify-content: space-between;
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .balance-box {
            flex: 1;
        }

        .balance-box .label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .balance-box .value {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
        }

        /* شبكة الإجراءات السريعة (إيداع، سحب، إلخ) */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.1s;
        }

        .action-item:active {
            transform: scale(0.95);
        }

        .action-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            margin: 0 auto 8px;
        }

        .bg-deposit { background: #ccfbf1; color: #0d9488; }
        .bg-withdraw { background: #f3e8ff; color: #9333ea; }
        .bg-account { background: #fef9c3; color: #ca8a04; }
        .bg-records { background: #fce7f3; color: #db2777; }

        .action-item span {
            font-size: 12px;
            font-weight: 600;
        }

        /* قائمة الخيارات المنسدلة */
        .menu-list {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            width: 30px;
            height: 30px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e2e8f0;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #0284c7;
            font-weight: bold;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="brand-info">
            <div class="brand-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <span class="brand-title">VirtualMall</span>
        </div>

        <div class="top-actions">
            <!-- زر لوحة التحكم للأدمن فقط -->
            <a href="admin.html" id="adminBtn" style="display: none; background: #ef4444; color: #fff; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 12px;">
                <i class="fa-solid fa-user-shield"></i> الإدارة
            </a>

            <div class="lang-btn">
                <i class="fa-solid fa-globe"></i>
                <span>عربي</span>
            </div>
        </div>
    </div>

    <!-- كارت الحساب والأرصدة -->
    <div class="user-card">
        <div class="user-header">
            <div class="vip-badge">
                <span id="vipLevel">VIP0</span> <i class="fa-solid fa-gem"></i>
            </div>
            <div class="user-phone" id="userEmail">جاري التحميل...</div>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
        </div>

        <div class="balance-container">
            <div class="balance-box">
                <span class="label">مبلغ الإيداع (USDT)</span>
                <span class="value" id="depositAmount">0</span>
            </div>
            <div class="balance-box">
                <span class="label">الرصيد الإجمالي (USDT)</span>
                <span class="value" id="totalBalance">0</span>
            </div>
        </div>
    </div>

    <!-- أزرار الخدمات السريعة -->
    <div class="actions-grid">
        <a href="#" class="action-item">
            <div class="action-icon bg-deposit"><i class="fa-solid fa-wallet"></i></div>
            <span>إيداع</span>
        </a>
        <a href="#" class="action-item">
            <div class="action-icon bg-withdraw"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <span>يسحب</span>
        </a>
        <a href="#" class="action-item">
            <div class="action-icon bg-account"><i class="fa-solid fa-building-columns"></i></div>
            <span>حساب</span>
        </a>
        <a href="#" class="action-item">
            <div class="action-icon bg-records"><i class="fa-solid fa-chart-line"></i></div>
            <span>سجلات</span>
        </a>
    </div>

    <!-- قائمة الخيارات -->
    <div class="menu-list">
        <div class="menu-item">
            <div class="menu-item-left">
                <div class="menu-icon"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
                <span>تحويل</span>
            </div>
            <i class="fa-solid fa-chevron-left" style="color: #cbd5e1; font-size: 12px;"></i>
        </div>

        <div class="menu-item">
            <div class="menu-item-left">
                <div class="menu-icon" style="background: #f1f5f9; color: #475569;"><i class="fa-solid fa-minus"></i></div>
                <span>تغيير كلمة المرور</span>
            </div>
            <i class="fa-solid fa-chevron-left" style="color: #cbd5e1; font-size: 12px;"></i>
        </div>

        <div class="menu-item" onclick="handleLogout()">
            <div class="menu-item-left">
                <div class="menu-icon" style="background: #fef2f2; color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i></div>
                <span style="color: #ef4444;">تسجيل الخروج</span>
            </div>
            <i class="fa-solid fa-chevron-left" style="color: #cbd5e1; font-size: 12px;"></i>
        </div>
    </div>
</div>

<!-- شريط التنقل السفلي -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fa-solid fa-user"></i>حسابي</a>
    <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i>المهام</a>
    <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i>الفريق</a>
    <a href="vip.html" class="nav-item"><i class="fa-solid fa-crown"></i>VIP</a>
</div>

<!-- تضمين الملفات البرمجية -->
<script src="js/config.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function () {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const currentUser = localStorage.getItem('currentUser');
        const isAdmin = localStorage.getItem('isAdmin') === 'true';

        // التحقق من حالة تسجيل الدخول
        if (!isLoggedIn || !currentUser) {
            window.location.href = 'login.html';
            return;
        }

        // عرض اسم المستخدم
        document.getElementById('userEmail').innerText = currentUser;

        // 1. إذا كان الأدمن
        if (isAdmin) {
            document.getElementById('adminBtn').style.display = 'block';
            document.getElementById('totalBalance').innerText = "∞";
            document.getElementById('depositAmount').innerText = "∞";
            document.getElementById('vipLevel').innerText = "مدير النظام";
            return;
        }

        // 2. للمستخدمين العاديين: جلب البيانات الحقيقية من JSONBin
        try {
            let serverData = await fetchServerData();
            let usersDB = serverData.usersDB || {};
            let myData = usersDB[currentUser];

            if (myData) {
                document.getElementById('totalBalance').innerText = myData.balance !== undefined ? myData.balance : 0;
                document.getElementById('depositAmount').innerText = myData.deposit !== undefined ? myData.deposit : 0;
                document.getElementById('vipLevel').innerText = myData.vipLevel || 'VIP0';
            } else {
                // تصفير للحسابات الجديدة
                document.getElementById('totalBalance').innerText = "0";
                document.getElementById('depositAmount').innerText = "0";
                document.getElementById('vipLevel').innerText = "VIP0";
            }
        } catch (err) {
            console.error("خطأ في جلب بيانات المستخدم:", err);
            document.getElementById('totalBalance').innerText = "0";
            document.getElementById('depositAmount').innerText = "0";
            document.getElementById('vipLevel').innerText = "VIP0";
        }
    });

    // تسجيل الخروج
    function handleLogout() {
        if (confirm('هل أنت تأكد من تسجيل الخروج؟')) {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    }
</script>

</body>
</html>
