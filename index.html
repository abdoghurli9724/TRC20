<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افتراضية مول - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <!-- Header مع زر تسجيل الخروج -->
    <div class="app-header">
        <div class="app-title">
            <i class="fa-solid fa-cart-shopping"></i> VirtualMall
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="userDisplay" style="font-size: 12px; color: #555;"></span>
            <button onclick="handleLogout()" style="background: #ff5252; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </div>
    </div>

    <!-- VIP 1 -->
    <div class="vip-card">
        <div class="vip-body">
            <div class="vip-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="vip-info">
                <div class="vip-info-row"><span>الربح اليومي:</span> <span>1.00 USDT</span></div>
                <div class="vip-info-row"><span>إجمالي الربح:</span> <span>365.00 USDT</span></div>
            </div>
        </div>
        <button class="btn-unlock" onclick="openPaymentModal('VIP1', '3.00')">فتح الآن 3.00 USDT</button>
    </div>

    <!-- VIP 2 -->
    <div class="vip-card">
        <div class="vip-badge">VIP2</div>
        <div class="vip-body">
            <div class="vip-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="vip-info">
                <div class="vip-info-row"><span>المهم اليومية:</span> <span>1</span></div>
                <div class="vip-info-row"><span>الربح لكل مهمة:</span> <span>5.40</span></div>
                <div class="vip-info-row"><span>الربح اليومي:</span> <span>5.40 USDT</span></div>
                <div class="vip-info-row"><span>إجمالي الربح:</span> <span>1,971.00 USDT</span></div>
            </div>
        </div>
        <button class="btn-unlock" onclick="openPaymentModal('VIP2', '16.00')">فتح الآن 16.00 USDT</button>
    </div>

    <!-- VIP 3 -->
    <div class="vip-card">
        <div class="vip-badge">VIP3</div>
        <div class="vip-body">
            <div class="vip-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="vip-info">
                <div class="vip-info-row"><span>المهم اليومية:</span> <span>1</span></div>
                <div class="vip-info-row"><span>الربح لكل مهمة:</span> <span>30.00</span></div>
                <div class="vip-info-row"><span>الربح اليومي:</span> <span>30.00 USDT</span></div>
                <div class="vip-info-row"><span>إجمالي الربح:</span> <span>10,950.00 USDT</span></div>
            </div>
        </div>
        <button class="btn-unlock" onclick="openPaymentModal('VIP3', '88.00')">فتح الآن 88.00 USDT</button>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    // التحقق من أن المستخدم مسجل دخول بالفعل، وإلا تحويله للتسجيل
    if (!localStorage.getItem('isLoggedIn')) {
        window.location.href = 'login.html';
    } else {
        // عرض اسم المستخدم الحالي إن وجد
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            document.getElementById('userDisplay').innerText = currentUser;
        }
    }
</script>

</body>
</html>
