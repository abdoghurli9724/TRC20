<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #cce7ff; min-height: 100vh; padding-bottom: 90px; direction: rtl; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-info { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; }
        .brand-icon { width: 35px; height: 35px; background: #00b0ff; color: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; }

        .user-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .vip-badge { background: #fef08a; color: #854d0e; padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .balance-container { display: flex; justify-content: space-between; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 10px; }

        .actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .action-item { background: #fff; padding: 15px 5px; border-radius: 15px; text-align: center; cursor: pointer; transition: transform 0.1s; }
        .action-item:active { transform: scale(0.95); }
        .action-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 0 auto 8px; font-size: 18px; }

        .bg-deposit { background: #ccfbf1; color: #0d9488; }
        .bg-withdraw { background: #f3e8ff; color: #9333ea; }
        .bg-account { background: #fef9c3; color: #ca8a04; }
        .bg-records { background: #fce7f3; color: #db2777; }

        .menu-list { background: #fff; border-radius: 20px; overflow: hidden; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 14px; font-weight: 600; }

        .bottom-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; max-width: 480px; margin: 0 auto; background: #ffffff; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid #e2e8f0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; text-align: center; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: #0284c7; font-weight: bold; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #fff; width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .close-btn { font-size: 22px; color: #94a3b8; cursor: pointer; }
        .modal-body label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; }
        .modal-body input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; font-size: 14px; outline: none; }
        .btn-modal { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="brand-info">
            <div class="brand-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <span>VirtualMall</span>
        </div>
    </div>

    <div class="user-card">
        <div class="user-header">
            <div class="vip-badge" id="vipLevelDisplay">VIP0 <i class="fa-solid fa-gem"></i></div>
            <div style="font-weight:bold" id="userPhoneDisplay">---</div>
        </div>
        <div class="balance-container">
            <div><small style="color:#64748b">مبلغ الإيداع</small><h3 id="depDisplay">$0</h3></div>
            <div><small style="color:#64748b">الرصيد الإجمالي</small><h3 id="balDisplay">$0.00</h3></div>
        </div>
    </div>

    <div class="actions-grid">
        <div class="action-item" onclick="showModal('depositModal')"><div class="action-icon bg-deposit"><i class="fa-solid fa-wallet"></i></div><span>إيداع</span></div>
        <div class="action-item" onclick="showModal('withdrawModal')"><div class="action-icon bg-withdraw"><i class="fa-solid fa-hand-holding-dollar"></i></div><span>يسحب</span></div>
        <div class="action-item" onclick="showModal('accountModal')"><div class="action-icon bg-account"><i class="fa-solid fa-building-columns"></i></div><span>حساب</span></div>
        <div class="action-item" onclick="showModal('recordsModal'); loadHistory();"><div class="action-icon bg-records"><i class="fa-solid fa-chart-line"></i></div><span>سجلات</span></div>
    </div>

    <div class="menu-list">
        <div class="menu-item" id="adminBtn" style="display: none; background: #fef2f2;" onclick="window.location.href='admin.html'">
            <span style="color: #dc2626;"><i class="fa-solid fa-user-shield"></i> لوحة التحكم (الأدمن)</span>
            <i class="fa-solid fa-chevron-left" style="color: #dc2626; font-size: 12px;"></i>
        </div>

        <div class="menu-item" onclick="handleLogout()">
            <span style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</span>
            <i class="fa-solid fa-chevron-left" style="color: #cbd5e1; font-size: 12px;"></i>
        </div>
    </div>
</div>

<!-- نافذة الإيداع -->
<div class="modal-overlay" id="depositModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="font-size:16px;">قسم الإيداع (TRC20)</h3>
            <div class="close-btn" onclick="hideModal('depositModal')">&times;</div>
        </div>
        <div class="modal-body">
            <label>عنوان المحفظة للتحويل (TRC20):</label>
            <input type="text" value="TYx89A9283471...TRC20" readonly style="background:#f8fafc; text-align:center; font-weight:bold;">
            <label>المبلغ المراد شحنه ($):</label>
            <input type="number" id="depAmount" placeholder="أدخل المبلغ بالدولار">
            <label>معرف المعاملة (TXID):</label>
            <input type="text" id="depTXID" placeholder="أدخل TXID العملية">
            <button class="btn-modal" onclick="submitDeposit()">تقديم طلب الشحن</button>
        </div>
    </div>
</div>

<!-- نافذة السحب -->
<div class="modal-overlay" id="withdrawModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>قسم السحب (USDT TRC20)</h3>
            <div class="close-btn" onclick="hideModal('withdrawModal')">&times;</div>
        </div>
        <div class="modal-body">
            <label>مبلغ السحب ($):</label>
            <input type="number" id="withdrawAmount" placeholder="أدخل المبلغ">
            <label>عنوان محفظتك (USDT TRC20):</label>
            <input type="text" id="withdrawAddress" placeholder="أدخل عنوان المحفظة">
            <button class="btn-modal" onclick="submitWithdraw()">تأكيد طلب السحب</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="accountModal">
    <div class="modal-box">
        <div class="modal-header"><h3>تفاصيل الحساب</h3><div class="close-btn" onclick="hideModal('accountModal')">&times;</div></div>
        <div class="modal-body"><p id="accInfo"></p><br><button class="btn-modal" onclick="hideModal('accountModal')">إغلاق</button></div>
    </div>
</div>

<!-- نافذة السجلات -->
<div class="modal-overlay" id="recordsModal">
    <div class="modal-box">
        <div class="modal-header"><h3>سجل العمليات</h3><div class="close-btn" onclick="hideModal('recordsModal')">&times;</div></div>
        <div class="modal-body">
            <div id="recordsList" style="max-height: 250px; overflow-y: auto;"></div>
            <br><button class="btn-modal" onclick="hideModal('recordsModal')">إغلاق</button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
    <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>المهام</span></a>
    <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>الفريق</span></a>
    <a href="vip.html" class="nav-item"><i class="fa-solid fa-crown"></i><span>VIP</span></a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const currentUser = localStorage.getItem('currentUser');
        const isAdmin = localStorage.getItem('isAdmin');
        
        if (!currentUser || currentUser === 'null' || currentUser === 'undefined') {
            window.location.replace('login.html');
            return;
        }

        if (isAdmin === 'true' || currentUser === 'admin') {
            document.getElementById('adminBtn').style.display = 'flex';
        }

        initUser(currentUser);
    });

    function initUser(currentUser) {
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        if(!users[currentUser]) {
            users[currentUser] = { phone: currentUser, balance: 0, deposit: 0, vip: 'VIP0', history: [] };
            localStorage.setItem('usersDB', JSON.stringify(users));
        }
        let u = users[currentUser];
        document.getElementById('userPhoneDisplay').innerText = u.phone;
        document.getElementById('balDisplay').innerText = '$' + (u.balance || 0).toFixed(2);
        document.getElementById('depDisplay').innerText = '$' + (u.deposit || 0).toFixed(2);
        document.getElementById('vipLevelDisplay').innerText = u.vip || 'VIP0';
        document.getElementById('accInfo').innerText = `اسم المستخدم: ${u.phone} | المستوى: ${u.vip}`;
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    function submitDeposit() {
        const currentUser = localStorage.getItem('currentUser');
        let amount = parseFloat(document.getElementById('depAmount').value);
        let txid = document.getElementById('depTXID').value.trim();

        if(!amount || amount <= 0 || !txid) {
            return alert('يرجى كتابة المبلغ ومعرف المعاملة TXID بشكل صحيح!');
        }

        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        requests.push({ id: Date.now(), user: currentUser, amount: amount, txid: txid, address: 'TYx89A9283471...TRC20', status: 'معلق' });
        localStorage.setItem('depositRequests', JSON.stringify(requests));

        // إضافة سجل معلق للمستخدم
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        if(!users[currentUser].history) users[currentUser].history = [];
        users[currentUser].history.unshift({ type: 'إيداع', amount: `+$${amount}`, title: 'طلب شحن قيد المراجعة', date: new Date().toLocaleString('ar-EG') });
        localStorage.setItem('usersDB', JSON.stringify(users));

        alert('تم تقديم طلب الشحن بنجاح وهو قيد المراجعة الان!');
        document.getElementById('depAmount').value = '';
        document.getElementById('depTXID').value = '';
        hideModal('depositModal');
    }

    function submitWithdraw() {
        const currentUser = localStorage.getItem('currentUser');
        let amount = parseFloat(document.getElementById('withdrawAmount').value);
        let address = document.getElementById('withdrawAddress').value.trim();
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let u = users[currentUser];

        if (!amount || amount <= 0 || !address) {
            return alert('يرجى إدخال المبلغ وعنوان المحفظة بشكل صحيح!');
        }

        if (u.balance < amount) {
            return alert('رصيدك المتاح غير كافٍ للسحب!');
        }

        // خصم المبلغ وإضافة العملية في السجل
        u.balance -= amount;
        if(!u.history) u.history = [];
        u.history.unshift({ type: 'سحب', amount: `-$${amount}`, title: `طلب سحب إلى ${address.substring(0,6)}...`, date: new Date().toLocaleString('ar-EG') });

        localStorage.setItem('usersDB', JSON.stringify(users));
        alert('تم تقديم طلب السحب بنجاح وسوف يصلك إلى محفظتك قريبًا!');
        
        initUser(currentUser);
        hideModal('withdrawModal');
    }

    function loadHistory() {
        const currentUser = localStorage.getItem('currentUser');
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let history = users[currentUser]?.history || [];
        let list = document.getElementById('recordsList');

        if (history.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#64748b;">لا توجد سجلات سابقة</p>';
            return;
        }

        let html = '';
        history.forEach(item => {
            let isPositive = item.amount.includes('+');
            html += `
            <div class="history-item">
                <div>
                    <b>${item.title}</b><br>
                    <small style="color:#94a3b8;">${item.date}</small>
                </div>
                <div style="font-weight:bold; color: ${isPositive ? '#16a34a' : '#ef4444'};">
                    ${item.amount}
                </div>
            </div>`;
        });
        list.innerHTML = html;
    }

    function handleLogout() {
        if(confirm('هل تريد تسجيل الخروج؟')) {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('isAdmin');
            alert('تم تسجيل الخروج بنجاح!');
            window.location.replace('login.html');
        }
    }
</script>
</body>
</html>
