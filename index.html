<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mall - لوحة التحكم</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b1021;
      --card-bg: #151b31;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(11, 16, 33, 0.9);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.25rem; }
    .logo-area span { color: var(--accent-blue); }

    .main-container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; padding-bottom: 90px; }
    
    .user-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
    }
    .balance-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: var(--radius-md); padding: 20px; text-align: center;
      border: 1px solid var(--border-color); margin-top: 15px;
    }
    .balance-box h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
    .balance-box .amount { font-size: 2rem; font-weight: 800; color: var(--accent-green); }

    .actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .action-btn {
      background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 14px; border-radius: var(--radius-md);
      text-align: center; text-decoration: none; font-weight: 600; font-size: 0.95rem;
      display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s;
    }
    .action-btn i { font-size: 1.5rem; color: var(--accent-blue); }
    .action-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--accent-blue); }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(11, 16, 33, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
      padding: 10px 0; z-index: 1000; max-width: 600px; margin: 0 auto; right: 0;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; text-decoration: none;
      color: var(--text-muted); font-size: 0.75rem; gap: 4px;
    }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--accent-blue); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo-area">
      <i class="bi bi-shop" style="color: var(--accent-blue);"></i>
      Virtual<span>Mall</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <!-- مكان زر الأدمن (يظهر برمجياً فقط للأدمن ولا يوجد في الـ HTML الثابت) -->
      <div id="adminBtnContainer"></div>

      <div class="cart-icon-btn" onclick="window.location.href='tasks.html'" style="cursor: pointer; font-size: 1.2rem;">
        <i class="bi bi-cart3"></i>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div class="user-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2 id="usernameText" style="font-size: 1.2rem; margin-bottom: 4px;">جاري التحميل...</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem;">رتبة الحساب: <span id="vipRankText" style="color: var(--accent-blue); font-weight: 700;">VIP0</span></p>
        </div>
        <div style="text-align: left;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">إجمالي الإيداع</span>
          <div id="totalDepositVal" style="font-weight: 700; color: var(--text-main);">$0.00</div>
        </div>
      </div>

      <div class="balance-box">
        <h3>الرصيد المتاح للسحب</h3>
        <div class="amount" id="availableBalanceVal">$0.00</div>
      </div>
    </div>

    <div class="actions-grid">
      <a href="deposit.html" class="action-btn">
        <i class="bi bi-wallet2"></i>
        <span>إيداع رصيد</span>
      </a>
      <a href="withdraw.html" class="action-btn">
        <i class="bi bi-cash-coin"></i>
        <span>سحب أرباح</span>
      </a>
      <a href="records.html" class="action-btn">
        <i class="bi bi-file-earmark-text"></i>
        <span>السجلات والطلبات</span>
      </a>
      <a href="team.html" class="action-btn">
        <i class="bi bi-people"></i>
        <span>دعوة الأصدقاء</span>
      </a>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="bi bi-house-door-fill"></i><span>الرئيسية</span></a>
    <a href="tasks.html" class="nav-item"><i class="bi bi-basket"></i><span>المهام</span></a>
    <a href="records.html" class="nav-item"><i class="bi bi-journal-text"></i><span>السجلات</span></a>
    <a href="profile.html" class="nav-item"><i class="bi bi-person-fill"></i><span>حسابي</span></a>
  </nav>

  <script src="db.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('activeUsername');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      const db = await getCloudDB();
      const user = db.users.find(u => u.username === activeUsername);

      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // عرض بيانات المستخدم الأساسية
      document.getElementById('usernameText').innerText = user.username;
      document.getElementById('vipRankText').innerText = user.vip || 'VIP0';
      document.getElementById('totalDepositVal').innerText = '$' + parseFloat(user.totalDeposit || 0).toFixed(2);
      document.getElementById('availableBalanceVal').innerText = '$' + parseFloat(user.balance || 0).toFixed(2);

      // إظهار زر الأدمن برمجياً فقط إذا كان المستخدم من ضمن قائمة الأدمن المعتمدة
      const adminUsers = ['admin', '088888888']; 
      if (adminUsers.includes(user.username)) {
        const container = document.getElementById('adminBtnContainer');
        container.innerHTML = `
          <a href="admin.html" style="display: flex; align-items: center; gap: 4px; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 700; text-decoration: none;">
            <i class="bi bi-shield-fill-exclamation"></i>
            <span>الأدمن</span>
          </a>
        `;
      }
    });
  </script>
</body>
</html>
