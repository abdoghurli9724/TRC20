<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - مركز المهام والتقييمات</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-list-check" style="color: var(--accent-blue);"></i>
      مركز <span>المهام</span>
    </div>
    <div class="vip-badge" id="vipHeaderBadge">
      <i class="fa-solid fa-crown"></i>
      <span id="userVipText">VIP0</span>
    </div>
  </header>

  <!-- Countdown Timer Box -->
  <div class="timer-box">
    <i class="fa-solid fa-clock" style="margin-left: 6px;"></i>
    الوقت المتبقي لتجديد المهام اليومية: <span id="countdownTimer">24:00:00</span>
  </div>

  <!-- User Status Header -->
  <div style="margin: 0 20px 16px 20px; background-color: var(--bg-card); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div style="font-size: 0.85rem; color: var(--text-secondary);">المهام المكتملة اليوم</div>
      <div style="font-size: 1.2rem; font-weight: 800; color: var(--accent-blue);" id="taskProgressText">0 / 0</div>
    </div>
    <a href="vip.html" style="background-color: rgba(245, 158, 11, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 700;">
      <i class="fa-solid fa-arrow-up-right-dots"></i> ترقية VIP
    </a>
  </div>

  <!-- Tasks Container -->
  <main id="tasksContainer">
    <!-- Dynamic Tasks Will Be Rendered Here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item active">
      <i class="fa-solid fa-list-check"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item">
      <i class="fa-solid fa-crown"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Tasks Logic Script -->
  <script>
    // Configurable VIP Tasks Limits and Rewards
    const VIP_CONFIG = {
      "VIP0": { dailyLimit: 2, rewardPerTask: 0.25, title: "منتج تقييم أساسي" },
      "VIP1": { dailyLimit: 4, rewardPerTask: 1.25, title: "منتج تقييم مميز" },
      "VIP2": { dailyLimit: 6, rewardPerTask: 3.50, title: "منتج تقييم احترافي" },
      "VIP3": { dailyLimit: 10, rewardPerTask: 8.00, title: "منتج تقييم ذهبي" }
    };

    // Dummy Mock Products Catalog
    const PRODUCTS_CATALOG = [
      { name: "ساعة ذكية مقاومة للماء - الإصدار الرياضي", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&q=80" },
      { name: "سماعات لاسلكية عازلة للضوضاء", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200&q=80" },
      { name: "نظارات شمسية كلاسيكية متطورة", img: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=200&q=80" },
      { name: "حقيبة ظهر جلدية فاخرة للأعمال", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=200&q=80" },
      { name: "كاميرا تصوير رقمية احترافية", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=200&q=80" },
      { name: "حذاء رياضي مريح للجري والتمارين", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&q=80" },
      { name: "ماكينة إعداد القهوة السريعة", img: "https://images.unsplash.com/photo-1517668808822-9ebd02f2a888?w=200&q=80" },
      { name: "عطر فاخر بزيوث طبيعية مركزة", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=200&q=80" },
      { name: "مكبر صوت بلوتوث محمول عالي الدقة", img: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=200&q=80" },
      { name: "لوحة مفاتيح ميكانيكية مضيئة للألعاب", img: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=200&q=80" }
    ];

    let currentUserObj = null;

    // Load Tasks Logic
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      startCountdownTimer();

      try {
        currentUserObj = await getCurrentUser();
        if (!currentUserObj) {
          logoutUser();
          return;
        }

        // Check & Reset Daily Tasks if a new day has arrived
        const todayStr = new Date().toISOString().split('T')[0];
        if (currentUserObj.lastTaskResetDate !== todayStr) {
          currentUserObj.completedTasksToday = [];
          currentUserObj.lastTaskResetDate = todayStr;
          await updateUserData(currentUserObj.username, {
            completedTasksToday: [],
            lastTaskResetDate: todayStr
          });
        }

        renderTasksPage();

      } catch (error) {
        console.error('Error loading tasks:', error);
      }
    });

    // Render Page Tasks UI
    function renderTasksPage() {
      const userVip = currentUserObj.vip || "VIP0";
      const config = VIP_CONFIG[userVip] || VIP_CONFIG["VIP0"];

      document.getElementById('userVipText').innerText = userVip;

      const completedCount = (currentUserObj.completedTasksToday || []).length;
      document.getElementById('taskProgressText').innerText = `${completedCount} / ${config.dailyLimit}`;

      const container = document.getElementById('tasksContainer');
      container.innerHTML = '';

      for (let i = 0; i < config.dailyLimit; i++) {
        const taskId = `TASK_${userVip}_${i + 1}`;
        const isCompleted = (currentUserObj.completedTasksToday || []).includes(taskId);
        const product = PRODUCTS_CATALOG[i % PRODUCTS_CATALOG.length];

        const card = document.createElement('div');
        card.className = 'task-card';
        // تعديل الهيكل الداخلي للبطاقة ليطابق التصميم المطلوب بدقة (صورة على اليسار، تفاصيل بالمنتج، وزر إكمال المهمة على اليمين)
        card.style.cssText = "display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 12px;";
        
        card.innerHTML = `
          <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
            <img src="${product.img}" alt="${product.name}" class="task-img" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--bg-main);">
            <div class="task-info" style="flex: 1; min-width: 0;">
              <div class="task-title" style="font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${product.name}</div>
              <div class="task-profit" style="font-size: 0.85rem; font-weight: 800; color: var(--accent-green);">+$${config.rewardPerTask.toFixed(2)}</div>
            </div>
          </div>
          <button class="task-action-btn ${isCompleted ? 'completed' : ''}" 
                  id="btn_${taskId}" 
                  onclick="processTask('${taskId}', ${config.rewardPerTask})" 
                  style="padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; cursor: pointer; border: none; background: ${isCompleted ? 'var(--bg-main)' : 'var(--accent-blue)'}; color: ${isCompleted ? 'var(--text-secondary)' : '#fff'};"
                  ${isCompleted ? 'disabled' : ''}>
            ${isCompleted ? 'تم التقييم' : 'إكمال المهمة'}
          </button>
        `;
        container.appendChild(card);
      }
    }

    // Process Task Completion
    async function processTask(taskId, reward) {
      const btn = document.getElementById(`btn_${taskId}`);
      if (!btn || btn.disabled) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px; height:16px;"></span> جاري المعالجة...';

      try {
        const db = await getCloudDB();
        const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);

        if (userIndex !== -1) {
          const user = db.users[userIndex];
          
          if (!user.completedTasksToday) user.completedTasksToday = [];
          if (!user.history) user.history = [];

          user.completedTasksToday.push(taskId);
          user.balance = parseFloat(user.balance || 0) + parseFloat(reward);

          // Add transaction to history
          user.history.unshift({
            id: generateTransactionId(),
            type: "task",
            title: "عمولة تقييم منتج",
            amount: parseFloat(reward),
            status: "completed",
            date: new Date().toLocaleString('ar-EG')
          });

          // Update Cloud Storage
          const success = await updateCloudDB(db);

          if (success) {
            currentUserObj = user;
            renderTasksPage();
            alert(`تم تقييم المنتج بنجاح! تم إضافة $${reward.toFixed(2)} إلى رصيدك المتاح.`);
          } else {
            alert('حدث خطأ في تحديث البيانات بالسحابة، حاول ثانية');
            btn.disabled = false;
            btn.innerText = 'إكمال المهمة';
          }
        }
      } catch (error) {
        console.error('Task error:', error);
        alert('فشل الاتصال الخادم');
        btn.disabled = false;
        btn.innerText = 'إكمال المهمة';
      }
    }

    // Countdown Timer logic to midnight
    function startCountdownTimer() {
      function updateTimer() {
        const now = new Date();
        const midnight = new Date();
        midnight.setHours(24, 0, 0, 0);

        const diff = midnight - now;

        const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

        document.getElementById('countdownTimer').innerText = `${hours}:${minutes}:${seconds}`;
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }
  </script>
</body>
</html>
