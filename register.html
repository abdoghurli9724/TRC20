<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <h2>إنشاء حساب جديد</h2>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="input-group">
                <label>البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" id="regEmail" placeholder="أدخل بياناتك" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPass" placeholder="أدخل كلمة المرور" required>
            </div>
            <div class="input-group">
                <label>رمز الدعوة (اختياري)</label>
                <input type="text" placeholder="Invitation Code">
            </div>
            <div id="statusMsg" style="font-size: 13px; text-align: center; margin-bottom: 10px;"></div>
            <button type="submit" class="btn-submit btn-green">تسجيل حساب جديد</button>
        </form>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="login.html">Login (تسجيل الدخول)</a>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
