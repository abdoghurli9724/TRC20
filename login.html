<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - VirtualMall</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: #cce7ff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #00b0ff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #00b0ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0, 176, 255, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-header">
        <div class="brand-logo">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
        <div class="brand-title">VirtualMall</div>
    </div>

    <div class="login-card">
        <div class="card-title">تسجيل الدخول</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">اسم المستخدم / رقم الهاتف</label>
                <input type="text" id="username" class="input-field" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" class="input-field" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn-submit">دخول</button>
        </form>
    </div>
</div>

<!-- تضمين ملف الإعدادات أولاً -->
<script src="js/config.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.querySelector('.btn-submit');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري التحقق...";

            // 1. تسجيل دخول الأدمن
            if (usernameInput === ADMIN_USERNAME && passwordInput === ADMIN_PASSWORD) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', usernameInput);
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'index.html';
                return;
            }

            // 2. جلب بيانات السيرفر للأعضاء العاديين
            let serverData = await fetchServerData();
            let usersDB = serverData.usersDB || {};

            // إذا كان عضو جديد -> إنشاؤه برصيد 0
            if (!usersDB[usernameInput]) {
                usersDB[usernameInput] = {
                    password: passwordInput,
                    balance: 0,
                    deposit: 0,
                    vipLevel: 'VIP0'
                };
                serverData.usersDB = usersDB;
                await updateServerData(serverData);
            } else {
                // إذا كان عضو مسجل -> فحص كلمة المرور
                if (usersDB[usernameInput].password !== passwordInput) {
                    alert("كلمة المرور غير صحيحة!");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "دخول";
                    return;
                }
            }

            // حفظ بيانات الجلسة المحلية
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', usernameInput);
            localStorage.setItem('isAdmin', 'false');
            window.location.href = 'index.html';
        });
    });
</script>

</body>
</html>
