<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - VirtualMall</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cascading Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <h2>تسجيل الدخول</h2>
        </div>

        <form onsubmit="event.preventDefault(); localStorage.setItem('isLoggedIn', 'true'); window.location.href='index.html';">
            <div class="input-group">
                <label>البريد الإلكتروني أو الهاتف</label>
                <input type="text" placeholder="Email or Mobile" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit btn-purple">تسجيل الدخول</button>
        </form>

        <div class="auth-footer">
            ليس لديك حساب؟ <a href="register.html">Sign Up (إنشاء حساب)</a>
        </div>
    </div>
</div>

</body>
</html>
