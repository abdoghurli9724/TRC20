<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malaqa Online - تسجيل الدخول</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="bi bi-shop" style="color: var(--accent-blue);"></i>
      Online<span>Malaqa</span>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="form-container" style="max-width: 450px; margin: 50px auto;">
    <div class="text-center mb-20">
      <h2 style="font-size: 1.6rem; color: var(--text-primary); margin-bottom: 8px;">تسجيل الدخول</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">مرحباً بك مجدداً! أدخل بيانات حسابك للمتابعة</p>
    </div>

    <!-- Alert Box for Error Messages -->
    <div id="alertBox" style="display: none; padding: 12px; border-radius: var(--radius-md); margin-bottom: 16px; font-size: 0.85rem; text-align: center;"></div>

    <form id="loginForm">
      <!-- Username / Phone -->
      <div class="form-group">
        <label class="form-label" for="username">
          <i class="bi bi-telephone-fill" style="margin-left: 6px;"></i>رقم الهاتف / اسم المستخدم
        </label>
        <input type="text" id="username" class="form-input" placeholder="أدخل رقم الهاتف أو اسم المستخدم" required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">
          <i class="bi bi-lock-fill" style="margin-left: 6px;"></i>كلمة المرور
        </label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-input" placeholder="أدخل كلمة المرور" required>
          <i class="bi bi-eye-slash" id="togglePassword" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;"></i>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" id="rememberMe" style="accent-color: var(--accent-blue); width: 16px; height: 16px;"> تذكرني
        </label>
        <a href="#" id="forgotPasswordLink" style="color: var(--accent-blue);">نسيت كلمة المرور؟</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span id="btnText">تسجيل الدخول</span>
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
      </button>
    </form>

    <div class="text-center mt-20" style="font-size: 0.9rem; color: var(--text-secondary);">
      ليس لديك حساب؟ <a href="register.html" style="color: var(--accent-blue); font-weight: 700;">إنشاء حساب جديد</a>
    </div>
  </main>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Page JS Script -->
  <script>
    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // التبديل بين أيقونة العين المفتوحة والمغلقة لـ Bootstrap Icons
      togglePassword.classList.toggle('bi-eye');
      togglePassword.classList.toggle('bi-eye-slash');
    });

    // Display Alert Utility
    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'block';
      alertBox.innerText = message;
      if (type === 'error') {
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
        alertBox.style.color = 'var(--accent-red)';
        alertBox.style.border = '1px solid var(--accent-red)';
      } else {
        alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
        alertBox.style.color = 'var(--accent-green)';
        alertBox.style.border = '1px solid var(--accent-green)';
      }
    }

    // Check if session already active
    window.addEventListener('DOMContentLoaded', () => {
      const activeUser = localStorage.getItem('currentUser');
      if (activeUser) {
        window.location.href = 'index.html';
      }
    });

    // Forgot Password Alert Handler
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      alert('يرجى التواصل مع خدمة الدعم الفني عبر التلغرام لإعادة ضبط كلمة المرور الخاصة بحسابك.');
    });

    // Form Submission Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;

      if (!usernameInput || !passwordInput) {
        showAlert('يرجى تعبئة جميع الحقول المطلوبة', 'error');
        return;
      }

      // UI Loading State
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        // Fetch Cloud Database via db.js
        const db = await getCloudDB();

        // Search for user
        const targetUser = db.users.find(u => u.username === usernameInput && u.password === passwordInput);

        if (targetUser) {
          // Save session
          localStorage.setItem('currentUser', targetUser.username);
          
          showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك...', 'success');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          showAlert('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
          submitBtn.disabled = false;
          btnText.style.display = 'inline';
          btnSpinner.style.display = 'none';
        }

      } catch (error) {
        console.error('Login Error:', error);
        showAlert('حدث خطأ في الاتصال بالسحابة، يرجى المحاولة لاحقاً', 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
