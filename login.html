<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - VirtualMall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fa-solid fa-cart-shopping"></i></div>
            <h2>تسجيل الدخول</h2>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>البريد الإلكتروني أو الهاتف</label>
                <input type="text" id="loginEmail" placeholder="Email or Mobile" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" placeholder="Password" required>
            </div>
            <div id="statusMsg" style="font-size: 13px; text-align: center; margin-bottom: 10px;"></div>
            <button type="submit" class="btn-submit btn-purple">تسجيل الدخول</button>
        </form>

        <div class="auth-footer">
            ليس لديك حساب؟ <a href="register.html">Sign Up (إنشاء حساب)</a>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
