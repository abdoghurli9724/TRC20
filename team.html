<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - فريق العمل والإحالات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="profile.css">
  <style>
    /* تصميم حاوية الإشعارات العائمة Toast لتكون عصرية ومتناسقة */
    #toastContainer {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      width: 90%;
      max-width: 350px;
      pointer-events: none;
    }
    .toast-msg {
      background: #0f172a;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(20px);
      text-align: center;
      width: 100%;
      pointer-events: auto;
      border-right: 4px solid #10b981;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- حاوية الإشعارات العائمة -->
  <div id="toastContainer"></div>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="bi bi-people-fill" style="color: var(--accent-blue);"></i>
      فريق <span>العمل</span>
    </div>
  </header>

  <main style="max-width: 600px; margin: 0 auto 80px auto;">
    <!-- Referral Code & Link Card -->
    <section class="card-box" style="margin: 20px;">
      <h3 style="font-size: 1.05rem; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
        <i class="bi bi-share-fill" style="color: var(--accent-blue);"></i>
        رابط وكود الدعوة الخاص بك
      </h3>

      <!-- Referral Code Input Group -->
      <div style="margin-bottom: 12px;">
        <label class="form-label">كود الدعوة الخاص بك:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="myReferralCode" class="form-input" readonly value="جاري التحميل..." style="font-weight: 800; letter-spacing: 1px; color: var(--accent-gold);">
          <button class="submit-btn" style="width: auto; padding: 0 16px; font-size: 0.85rem;" onclick="copyInputText('myReferralCode', 'تم نسخ كود الدعوة بنجاح!')">
            <i class="bi bi-clipboard-fill"></i> نسخ
          </button>
        </div>
      </div>

      <!-- Referral Link Input Group -->
      <div>
        <label class="form-label">رابط الدعوة المباشر:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="myReferralLink" class="form-input" readonly value="جاري التحميل..." style="font-size: 0.8rem; direction: ltr; text-align: left;">
          <button class="submit-btn" style="width: auto; padding: 0 16px; font-size: 0.85rem;" onclick="copyInputText('myReferralLink', 'تم نسخ رابط الدعوة بنجاح!')">
            <i class="bi bi-link-45deg"></i> نسخ
          </button>
        </div>
      </div>
    </section>

    <!-- Overall Team Stats -->
    <section class="balance-card" style="margin: 0 20px 20px 20px;">
      <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 12px; font-weight: 700;">
        إحصائيات إجمالي الفريق
      </div>
      <div class="balance-grid">
        <div class="balance-item">
          <span class="balance-label">عدد الأعضاء</span>
          <span class="balance-value available" id="totalTeamMembers">0</span>
        </div>
        <div class="balance-item">
          <span class="balance-label">إجمالي أرباح الفريق</span>
          <span class="balance-value deposit" id="totalTeamCommission">$0.00</span>
        </div>
      </div>
    </section>

    <!-- Referral Packages & Commissions Container (Dynamic) -->
    <section style="margin: 0 20px;">
      <h3 style="font-size: 1rem; color: var(--text-primary); margin-bottom: 12px;">
        <i class="bi bi-award-fill" style="color: var(--accent-gold); margin-left: 6px;"></i>عمولات دعوة باقات VIP
      </h3>
      <div id="dynamicTeamPackagesContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 12px;">جاري تحميل العمولات...</div>
      </div>
    </section>

    <!-- Referred Users List -->
    <section class="card-box" style="margin: 20px;">
      <h3 style="font-size: 1rem; color: var(--text-primary); margin-bottom: 12px;">
        <i class="bi bi-list-ul" style="margin-left: 6px; color: var(--accent-blue);"></i>قائمة الأعضاء المدعوين
      </h3>
      <div id="referredUsersList" style="font-size: 0.85rem; color: var(--text-secondary);">
        جاري جلب القائمة من السحابة...
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="bi bi-house-fill"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="bi bi-check2-square"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item active">
      <i class="bi bi-people-fill"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item">
      <i class="bi bi-award-fill"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Team Controller Script -->
  <script>
    // دالة إظهار التنبيهات العصرية بدلاً من alert المتصفح
    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast-msg";
      toast.innerText = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add("show");
      }, 50);

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function copyInputText(inputId, successMsg) {
      const inputEl = document.getElementById(inputId);
      if (!inputEl || !inputEl.value) return;

      inputEl.select();
      inputEl.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputEl.value).then(() => {
        showToast(successMsg);
      }).catch(err => {
        console.error('Copy failed:', err);
        showToast('فشل النسخ، حاول مرة أخرى');
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      let db = getLocalDB();
      try {
        const cloudDb = await getCloudDB();
        if (cloudDb && cloudDb.users) {
          db = cloudDb;
        }
      } catch (e) {
        console.log("Using local DB fallback due to cloud fetch error.");
      }

      if (!db || !db.users) {
        db = { users: [], vipPackages: [] };
      }

      const user = db.users.find(u => u.username === activeUsername);

      if (!user) {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
        return;
      }

      const cloudVipPackages = (db && db.vipPackages) ? db.vipPackages : [];

      const myCode = user.referralCode || generateReferralCode();
      document.getElementById('myReferralCode').value = myCode;
      
      const baseUrl = window.location.origin + window.location.pathname.replace('team.html', 'register.html');
      document.getElementById('myReferralLink').value = `${baseUrl}?ref=${myCode}`;

      const level1Members = db.users.filter(u => u.invitedBy === user.username);
      const level1Usernames = level1Members.map(u => u.username);

      const level2Members = db.users.filter(u => u.invitedBy && level1Usernames.includes(u.invitedBy));
      const level2Usernames = level2Members.map(u => u.username);

      const level3Members = db.users.filter(u => u.invitedBy && level2Usernames.includes(u.invitedBy));

      const totalMembersCount = level1Members.length + level2Members.length + level3Members.length;
      document.getElementById('totalTeamMembers').innerText = totalMembersCount;

      let teamDeposits = 0;
      level1Members.forEach(m => {
        const matchedPkg = cloudVipPackages.find(p => p.id === m.vip || p.name === m.vip);
        const comm = matchedPkg ? parseFloat(matchedPkg.referralCommission || 0) : (parseFloat(m.totalDeposit || 0) * 0.10);
        teamDeposits += comm;
      });

      document.getElementById('totalTeamCommission').innerText = '$' + teamDeposits.toFixed(2);

      // --- توليد قائمة الباقات وعمولات الإحالة الخاصة بها ديناميكياً ---
      const packagesContainer = document.getElementById('dynamicTeamPackagesContainer');
      packagesContainer.innerHTML = '';

      if (cloudVipPackages.length === 0) {
        packagesContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 12px;">لا توجد باقات معرفة حالياً.</div>';
      } else {
        cloudVipPackages.forEach((pkg, index) => {
          const pkgId = pkg.id || `VIP${index}`;
          const pkgName = pkg.name || pkgId;
          const commissionAmount = parseFloat(pkg.referralCommission || 0).toFixed(2);

          const colors = ["var(--accent-blue)", "var(--accent-purple)", "var(--accent-gold)", "var(--accent-green)"];
          const borderColor = colors[index % colors.length];

          const cardDiv = document.createElement('div');
          cardDiv.className = 'card-box';
          cardDiv.style.marginBottom = '12px';
          cardDiv.style.display = 'flex';
          cardDiv.style.justifyContent = 'space-between';
          cardDiv.style.alignItems: 'center';
          cardDiv.style.borderRight = `4px solid ${borderColor}`;

          cardDiv.innerHTML = `
            <div>
              <div style="font-weight: 700; color: ${borderColor}; font-size: 0.95rem;">${pkgName}</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;">عمولة دعوة هذا المستوى</div>
            </div>
            <div style="text-align: left;">
              <div style="font-size: 1.05rem; font-weight: 800; color: var(--accent-gold);">+$${commissionAmount}</div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">لكل عضو مشترك</div>
            </div>
          `;
          packagesContainer.appendChild(cardDiv);
        });
      }

      // --- عرض قائمة الأعضاء المدعوين ---
      const listContainer = document.getElementById('referredUsersList');
      if (level1Members.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 12px;">لا يوجد أعضاء منضمين عبر كود الدعوة الخاص بك حتى الآن.</div>';
      } else {
        let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
        level1Members.forEach(m => {
          const maskedUsername = m.username.length > 4 ? m.username.substring(0, 3) + '****' + m.username.slice(-2) : m.username;
          
          let userVipDisplay = m.vip || 'VIP0';
          const matchedPkg = cloudVipPackages.find(p => p.id === m.vip || p.name === m.vip);
          if (matchedPkg) {
            userVipDisplay = matchedPkg.name || matchedPkg.id;
          }

          html += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background-color: var(--bg-main); border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
              <span><i class="bi bi-person-check-fill" style="color: var(--accent-green); margin-left:6px;"></i>${maskedUsername}</span>
              <span style="color: var(--accent-gold); font-size: 0.8rem; font-weight: 700;">${userVipDisplay}</span>
            </div>
          `;
        });
        html += '</div>';
        listContainer.innerHTML = html;
      }

    });
  </script>
</body>
</html>
