<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.8);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-bar h2 { font-size: 20px; color: #ef4444; }

        .btn-exit {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .card-box h3 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; }

        /* الجدول */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: right;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th { color: #94a3b8; font-weight: 600; }

        .btn-act {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }

        .btn-approve { background: #10b981; color: #fff; }
        .btn-reject { background: #ef4444; color: #fff; }

        /* تحكم الرصيد */
        .control-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .control-group input {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
        }

        #toastBox { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-right: 4px solid #38bdf8; font-size: 14px; }
        .toast.success { border-right-color: #10b981; }
        .toast.error { border-right-color: #ef4444; }
    </style>
</head>
<body>

<div id="toastBox"></div>

<div class="admin-container">
    <div class="header-bar">
        <h2><i class="fa-solid fa-user-shield"></i> لوحة إدارة المنصة (Admin)</h2>
        <button class="btn-exit" onclick="window.location.href='index.html'">العودة للموقع</button>
    </div>

    <!-- طلبات الإيداع -->
    <div class="card-box">
        <h3>طلبات الإيداع المعلقة</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>المستخدم</th>
                        <th>المبلغ</th>
                        <th>TXID</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="depTable"></tbody>
            </table>
        </div>
    </div>

    <!-- التحكم برصيد مستخدم -->
    <div class="card-box">
        <h3>تعديل رصيد مستخدم يدوياً</h3>
        <div class="control-group">
            <input type="text" id="targetUser" placeholder="اسم المستخدم / الهاتف">
            <input type="number" id="modAmount" placeholder="المبلغ (مثال 50 أو -20)">
            <button class="btn-act btn-approve" style="padding: 10px 20px; font-size: 13px;" onclick="modifyBalance()">تحديث الرصيد</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const isAdmin = localStorage.getItem('isAdmin');
        if (isAdmin !== 'true') {
            alert('عفواً، لا تملك صلاحية الوصول لهذه الصفحة!');
            window.location.href = 'index.html';
        }
        loadRequests();
    });

    function showToast(msg, type = 'info') {
        const toastBox = document.getElementById('toastBox');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        let icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info');
        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
        toastBox.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function loadRequests() {
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let tbody = document.getElementById('depTable');

        let pending = requests.filter(r => r.status === 'معلق');

        if (pending.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">لا توجد طلبات إيداع معلقة حالياً</td></tr>';
            return;
        }

        let html = '';
        pending.forEach(r => {
            html += `
                <tr>
                    <td>${r.user}</td>
                    <td style="color:#10b981; font-weight:bold;">$${r.amount}</td>
                    <td><small style="color:#94a3b8;">${r.txid}</small></td>
                    <td>
                        <button class="btn-act btn-approve" onclick="approveDep(${r.id})">قبول</button>
                        <button class="btn-act btn-reject" onclick="rejectDep(${r.id})">رفض</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function approveDep(id) {
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let req = requests.find(r => r.id === id);

        if (req) {
            req.status = 'مقبول';
            let users = JSON.parse(localStorage.getItem('usersDB')) || {};

            if (users[req.user]) {
                users[req.user].balance = (users[req.user].balance || 0) + req.amount;
                users[req.user].deposit = (users[req.user].deposit || 0) + req.amount;
                
                if (!users[req.user].history) users[req.user].history = [];
                users[req.user].history.unshift({ type: 'إيداع', amount: `+$${req.amount}`, title: 'تم تأكيد الإيداع من الإدارة', date: new Date().toLocaleString('ar-EG') });
            }

            localStorage.setItem('usersDB', JSON.stringify(users));
            localStorage.setItem('depositRequests', JSON.stringify(requests));
            showToast('تم قبول طلب الإيداع وإضافة الرصيد بنجاح!', 'success');
            loadRequests();
        }
    }

    function rejectDep(id) {
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let req = requests.find(r => r.id === id);

        if (req) {
            req.status = 'مرفوض';
            localStorage.setItem('depositRequests', JSON.stringify(requests));
            showToast('تم رفض طلب الإيداع.', 'error');
            loadRequests();
        }
    }

    function modifyBalance() {
        let target = document.getElementById('targetUser').value.trim();
        let amount = parseFloat(document.getElementById('modAmount').value);

        if (!target || isNaN(amount)) return showToast('يرجى كتابة اسم المستخدم والمبلغ بشكل صحيح', 'error');

        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        if (!users[target]) return showToast('المستخدم غير موجود!', 'error');

        users[target].balance = (users[target].balance || 0) + amount;
        
        if (!users[target].history) users[target].history = [];
        users[target].history.unshift({ type: 'تعديل', amount: `${amount >= 0 ? '+' : ''}$${amount}`, title: 'تعديل رصيد بواسطة الأدمن', date: new Date().toLocaleString('ar-EG') });

        localStorage.setItem('usersDB', JSON.stringify(users));
        showToast(`تم تعديل رصيد ${target} بنجاح! الرصيد الجديد: $${users[target].balance}`, 'success');
    }
</script>
</body>
</html>
