<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mall - لوحة تحكم الأدمن</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b1021;
      --card-bg: #151b31;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(11, 16, 33, 0.9);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    .main-container { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
    
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
    }
    h2 { font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

    .record-item, .user-item {
      background: #0f172a; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); padding: 15px; margin-bottom: 12px;
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .record-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
    
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-approve { background: var(--accent-green); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .btn-reject { background: var(--accent-red); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .btn-edit { background: var(--accent-blue); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }

    .badge-pending { color: var(--accent-yellow); background: rgba(245, 158, 11, 0.15); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; }
    .badge-approved { color: var(--accent-green); background: rgba(16, 185, 129, 0.15); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; }
    .badge-rejected { color: var(--accent-red); background: rgba(239, 68, 68, 0.15); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; }

    .alert { padding: 10px; border-radius: var(--radius-sm); margin-bottom: 15px; text-align: center; display: none; font-size: 0.9rem; }
    .alert-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; width: 100%; max-width: 400px;
    }
    .form-control {
      width: 100%; background: #0f172a; border: 1px solid var(--border-color);
      padding: 10px; border-radius: var(--radius-sm); color: var(--text-main); font-size: 1rem; outline: none; margin-bottom: 15px;
    }
    .form-control:focus { border-color: var(--accent-blue); }
  </style>
</head>
<body>

  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='index.html'">
      <i class="bi bi-arrow-right" style="font-size: 1.2rem;"></i>
      <span style="font-weight: 700; color: var(--accent-red);">لوحة تحكم الأدمن</span>
    </div>
    <div onclick="location.reload()" style="cursor: pointer; font-size: 1.1rem;"><i class="bi bi-arrow-clockwise"></i></div>
  </header>

  <div class="main-container">
    <div id="alertBox" class="alert"></div>

    <!-- قسم طلبات الإيداع والسحب -->
    <div class="card">
      <h2><i class="bi bi-list-check" style="color: var(--accent-blue);"></i> طلبات الإيداع والسحب المعلقة</h2>
      <div id="requestsContainer">
        <p style="color: var(--text-muted); text-align: center; padding: 15px;">جاري تحميل الطلبات...</p>
      </div>
    </div>

    <!-- قسم إدارة أرصدة المستخدمين -->
    <div class="card">
      <h2><i class="bi bi-people-fill" style="color: var(--accent-green);"></i> إدارة أرصدة المستخدمين</h2>
      <div id="usersContainer">
        <p style="color: var(--text-muted); text-align: center; padding: 15px;">جاري تحميل المستخدمين...</p>
      </div>
    </div>
  </div>

  <!-- Modal تعديل الرصيد -->
  <div class="modal-overlay" id="editBalanceModal">
    <div class="modal-content">
      <h3 id="modalUsernameTitle" style="margin-bottom: 15px; font-size: 1.1rem;">تعديل رصيد المستخدم</h3>
      <input type="hidden" id="modalTargetUsername">
      <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 6px;">الرصيد المتاح الجديد ($)</label>
      <input type="number" id="newBalanceInput" class="form-control" step="any" placeholder="أدخل الرصيد الجديد">
      <div style="display: flex; gap: 10px;">
        <button class="btn-approve" style="flex: 1; padding: 10px;" onclick="saveNewBalance()">حفظ التعديل</button>
        <button class="btn-reject" style="flex: 1; padding: 10px;" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    let globalDB = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('activeUsername');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      globalDB = await getCloudDB();
      const currentUser = globalDB.users.find(u => u.username === activeUsername);

      const adminUsers = ['admin', '088888888'];
      if (!currentUser || !adminUsers.includes(currentUser.username)) {
        alert('غير مصرح لك بالدخول إلى هذه الصفحة');
        window.location.href = 'index.html';
        return;
      }

      renderAdminPanel();
    });

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type}`;
      box.innerText = msg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    function renderAdminPanel() {
      renderRequests();
      renderUsersList();
    }

    // عرض الطلبات المعلقة
    function renderRequests() {
      const container = document.getElementById('requestsContainer');
      
      if (!globalDB.records || globalDB.records.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 15px;">لا توجد أي طلبات مسجلة حالياً.</p>';
        return;
      }

      container.innerHTML = '';
      globalDB.records.forEach((record) => {
        let statusBadge = '';
        if (record.status === 'قيد الانتظار') statusBadge = '<span class="badge-pending">قيد الانتظار</span>';
        else if (record.status === 'مقبول') statusBadge = '<span class="badge-approved">مقبول</span>';
        else statusBadge = '<span class="badge-rejected">مرفوض</span>';

        const div = document.createElement('div');
        div.className = 'record-item';
        div.innerHTML = `
          <div class="record-header">
            <strong>${record.type === 'إيداع' ? 'إيداع رصيد' : 'سحب أرباح'} - $${record.amount}</strong>
            ${statusBadge}
          </div>
          <div class="record-details">
            <div>المستخدم: <strong>${record.username}</strong></div>
            <div>${record.type === 'إيداع' ? 'هاش التحويل (TXID):' : 'عنوان المحفظة:'} <span style="color: var(--text-main);">${record.details || record.address || 'غير متوفر'}</span></div>
            <div>التاريخ: ${record.date}</div>
          </div>
          ${record.status === 'قيد الانتظار' ? `
            <div class="btn-group">
              <button class="btn-approve" onclick="handleRequest('${record.id}', 'approve')">قبول الطلب</button>
              <button class="btn-reject" onclick="handleRequest('${record.id}', 'reject')">رفض الطلب</button>
            </div>
          ` : ''}
        `;
        container.appendChild(div);
      });
    }

    // عرض قائمة المستخدمين لتعديل أرصدتهم
    function renderUsersList() {
      const container = document.getElementById('usersContainer');
      
      if (!globalDB.users || globalDB.users.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 15px;">لا يوجد مستخدمون مسجلون.</p>';
        return;
      }

      container.innerHTML = '';
      globalDB.users.forEach((user) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div class="record-header">
            <div>
              <strong>${user.username}</strong>
              <span style="font-size: 0.75rem; color: var(--accent-blue); margin-right: 8px;">(${user.vip || 'VIP0'})</span>
            </div>
            <span style="color: var(--accent-green); font-weight: 700;">$${parseFloat(user.balance || 0).toFixed(2)}</span>
          </div>
          <div class="record-details">
            <div>إجمالي الإيداع: $${parseFloat(user.totalDeposit || 0).toFixed(2)} | إجمالي السحب: $${parseFloat(user.totalWithdraw || 0).toFixed(2)}</div>
          </div>
          <div class="btn-group">
            <button class="btn-edit" onclick="openEditModal('${user.username}', ${user.balance || 0})">
              <i class="bi bi-wallet2"></i> تعديل الرصيد المتاح
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // فتح نافذة تعديل الرصيد
    function openEditModal(username, currentBalance) {
      document.getElementById('modalTargetUsername').value = username;
      document.getElementById('modalUsernameTitle').innerText = `تعديل رصيد المستخدم: ${username}`;
      document.getElementById('newBalanceInput').value = currentBalance;
      document.getElementById('editBalanceModal').style.display = 'flex';
    }

    // إغلاق النافذة
    function closeModal() {
      document.getElementById('editBalanceModal').style.display = 'none';
    }

    // حفظ الرصيد الجديد في السحابة
    async function saveNewBalance() {
      const username = document.getElementById('modalTargetUsername').value;
      const newBalance = parseFloat(document.getElementById('newBalanceInput').value);

      if (isNaN(newBalance) || newBalance < 0) {
        alert('الرجاء إدخال مبلغ صالح');
        return;
      }

      const userIndex = globalDB.users.findIndex(u => u.username === username);
      if (userIndex !== -1) {
        globalDB.users[userIndex].balance = newBalance.toFixed(2);

        // تسجيل العملية في تاريخ المستخدم
        if (!globalDB.users[userIndex].history) globalDB.users[userIndex].history = [];
        globalDB.users[userIndex].history.unshift({
          id: 'ADJ-' + Math.floor(100000 + Math.random() * 900000),
          type: 'adjustment',
          title: 'تعديل رصيد بواسطة الأدمن',
          amount: newBalance,
          date: new Date().toLocaleString('ar-EG')
        });

        const success = await updateCloudDB(globalDB);
        if (success) {
          showAlert(`تم تعديل رصيد المستخدم ${username} بنجاح إلى $${newBalance.toFixed(2)}`, 'success');
          closeModal();
          globalDB = await getCloudDB();
          renderUsersList();
        } else {
          showAlert('حدث خطأ أثناء حفظ التعديل', 'error');
        }
      }
    }

    // قبول أو رفض الطلبات
    async function handleRequest(recordId, action) {
      const recordIndex = globalDB.records.findIndex(r => r.id === recordId);
      if (recordIndex === -1) return;

      const record = globalDB.records[recordIndex];
      const userIndex = globalDB.users.findIndex(u => u.username === record.username);

      if (action === 'approve') {
        globalDB.records[recordIndex].status = 'مقبول';

        if (userIndex !== -1) {
          const amount = parseFloat(record.amount);
          if (record.type === 'إيداع') {
            globalDB.users[userIndex].totalDeposit = (parseFloat(globalDB.users[userIndex].totalDeposit || 0) + amount).toFixed(2);
          } else if (record.type === 'سحب') {
            globalDB.users[userIndex].totalWithdraw = (parseFloat(globalDB.users[userIndex].totalWithdraw || 0) + amount).toFixed(2);
          }
        }
      } else {
        globalDB.records[recordIndex].status = 'مرفوض';

        if (record.type === 'سحب' && userIndex !== -1) {
          const amount = parseFloat(record.amount);
          globalDB.users[userIndex].balance = (parseFloat(globalDB.users[userIndex].balance || 0) + amount).toFixed(2);
        }
      }

      const success = await updateCloudDB(globalDB);
      if (success) {
        showAlert(`تم ${action === 'approve' ? 'قبول' : 'رفض'} الطلب بنجاح وتحديث البيانات!`, 'success');
        globalDB = await getCloudDB();
        renderAdminPanel();
      } else {
        showAlert('حدث خطأ أثناء حفظ التعديلات، حاول ثانية.', 'error');
      }
    }
  </script>
</body>
</html>
