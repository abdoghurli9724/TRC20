<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f1f5f9; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-size: 18px; margin-bottom: 15px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .user-item, .request-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
        .modal-box { background: #fff; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; position: relative; }
        .close-x { position: absolute; top: 10px; left: 15px; font-size: 20px; cursor: pointer; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 20px;">لوحة الإدارة الكاملة</h1>

    <!-- الأمر الأول: قائمة جميع المستخدمين -->
    <div class="card">
        <h2><i class="fa-solid fa-users"></i> قائمة أرقام كافة المستخدمين</h2>
        <div id="usersList"></div>
    </div>

    <!-- الأمر الثاني: قسم طلبات الشحن الإيداع -->
    <div class="card">
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> طلبات الشحن المعلقة</h2>
        <div id="requestsList"></div>
    </div>
</div>

<!-- النافذة المنبثقة لمعلومات المستخدم وبداخلها زر X للإغلاق -->
<div class="modal-overlay" id="userInfoModal">
    <div class="modal-box">
        <span class="close-x" onclick="closeUserModal()">X</span>
        <h3 style="margin-bottom:15px;">معلومات المستخدم التفصيلية</h3>
        <div id="modalContent" style="font-size:14px; line-height:1.8;"></div>
    </div>
</div>

<script>
    function loadAdminData() {
        // 1. عرض مستخدمين النظام
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let usersHTML = '';
        Object.keys(users).forEach(phone => {
            usersHTML += `
            <div class="user-item">
                <span><b>${phone}</b></span>
                <button class="btn btn-green" onclick="showUserDetails('${phone}')">عرض التفاصيل</button>
            </div>`;
        });
        document.getElementById('usersList').innerHTML = usersHTML || '<p style="color:#64748b;">لا يوجد مستخدمين مسجلين</p>';

        // 2. عرض طلبات الشحن
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let pending = requests.filter(r => r.status === 'معلق');
        let reqHTML = '';
        
        pending.forEach(req => {
            reqHTML += `
            <div class="request-item" style="flex-direction:column; align-items:flex-start; gap:6px;">
                <div><b>المستخدم:</b> ${req.user}</div>
                <div><b>العنوان TRC20:</b> <span style="font-size:11px; color:#0284c7;">${req.address}</span></div>
                <div><b>معرف المعاملة TXID:</b> <span style="font-size:11px; color:#d97706;">${req.txid}</span></div>
                <div><b>المبلغ:</b> $${req.amount}</div>
                <div style="display:flex; gap:10px; width:100%; margin-top:8px;">
                    <button class="btn btn-green" style="flex:1;" onclick="approveDeposit(${req.id})">إضافة رصيد</button>
                    <button class="btn btn-red" style="flex:1;" onclick="rejectDeposit(${req.id})">رفض الطلب</button>
                </div>
            </div>`;
        });
        document.getElementById('requestsList').innerHTML = reqHTML || '<p style="color:#64748b;">لا توجد طلبات شحن معلقة حالياً</p>';
    }

    function showUserDetails(phone) {
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let u = users[phone];
        if(u) {
            document.getElementById('modalContent').innerHTML = `
                <p><b>رقم الهاتف:</b> ${u.phone}</p>
                <p><b>الرصيد الإجمالي:</b> $${(u.balance || 0).toFixed(2)}</p>
                <p><b>مبلغ الإيداع:</b> $${(u.deposit || 0).toFixed(2)}</p>
                <p><b>مستوى VIP:</b> ${u.vip || 'VIP0'}</p>
                <p><b>رمز الدعوة:</b> ${u.referralCode || 'لا يوجد'}</p>
            `;
            document.getElementById('userInfoModal').style.display = 'flex';
        }
    }

    function closeUserModal() {
        document.getElementById('userInfoModal').style.display = 'none';
    }

    function approveDeposit(reqId) {
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let users = JSON.parse(localStorage.getItem('usersDB')) || {};
        let index = requests.findIndex(r => r.id === reqId);

        if(index !== -1) {
            let req = requests[index];
            if(users[req.user]) {
                users[req.user].balance = (users[req.user].balance || 0) + req.amount;
                users[req.user].deposit = (users[req.user].deposit || 0) + req.amount;
                requests[index].status = 'مقابول';

                localStorage.setItem('usersDB', JSON.stringify(users));
                localStorage.setItem('depositRequests', JSON.stringify(requests));
                alert(`تم شحن حساب المستخدم ${req.user} بمبلغ $${req.amount} بنجاح!`);
                loadAdminData();
            }
        }
    }

    function rejectDeposit(reqId) {
        let requests = JSON.parse(localStorage.getItem('depositRequests')) || [];
        let index = requests.findIndex(r => r.id === reqId);

        if(index !== -1) {
            requests[index].status = 'مرفوض';
            localStorage.setItem('depositRequests', JSON.stringify(requests));
            alert('تم إلغاء طلب الشحن بنجاح!');
            loadAdminData();
        }
    }

    document.addEventListener("DOMContentLoaded", loadAdminData);
</script>
</body>
</html>
