<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - VirtualMall</title>
  <link rel="stylesheet" href="profile.css">
  <style>
    .admin-section { margin-bottom: 24px; }
    .table-container { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.85rem; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
    th { color: var(--accent-gold); background: var(--bg-secondary); }
    .action-btns { display: flex; gap: 6px; }
    .btn-approve { background: var(--accent-green); color: #fff; padding: 6px 10px; font-size: 0.75rem; }
    .btn-reject { background: #ef4444; color: #fff; padding: 6px 10px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-logo"><i class="fa-solid fa-user-shield" style="color: var(--accent-gold);"></i> لوحة تحكم <span>الآدمن</span></div>
    <button onclick="logoutUser()" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; font-size: 0.8rem;">خروج</button>
  </div>

  <div style="padding: 20px;">
    <!-- قسم طلبات الإيداع -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 1rem; margin-bottom: 10px;"><i class="fa-solid fa-file-arrow-down"></i> طلبات الإيداع المعلقة</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>المبلغ</th>
              <th>رقم المعاملة (TXID)</th>
              <th>التاريخ</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="depositRequestsTable">
            <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- قسم طلبات السحب -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 1rem; margin-bottom: 10px;"><i class="fa-solid fa-file-arrow-up"></i> طلبات السحب المعلقة</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>المبلغ</th>
              <th>المحفظة</th>
              <th>التاريخ</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="withdrawRequestsTable">
            <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- قسم إدارة المستخدمين والرصيد -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 1rem; margin-bottom: 10px;"><i class="fa-solid fa-users-gear"></i> إدارة أرصدة المستخدمين</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>الرصيد الحالي</th>
              <th>مستوى VIP</th>
              <th>تعديل الرصيد</th>
            </tr>
          </thead>
          <tbody id="usersTable">
            <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    async function loadAdminData() {
      const currentUser = await getCurrentUser();
      // تحقق مبدئي بسيط لصلاحية الأدمن (يمكن جعله مخصصاً لرقم حساب معين مثل 088888888 أو حساب الآدمن)
      if (!currentUser) {
        window.location.href = "login.html";
        return;
      }

      const db = await getCloudDB();

      // عرض طلبات الإيداع المعلقة
      const depositTbody = document.getElementById("depositRequestsTable");
      depositTbody.innerHTML = "";
      if (!db.depositRequests || db.depositRequests.filter(r => r.status === 'pending').length === 0) {
        depositTbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">لا توجد طلبات إيداع معلقة</td></tr>`;
      } else {
        db.depositRequests.filter(r => r.status === 'pending').forEach((req, index) => {
          depositTbody.innerHTML += `
            <tr>
              <td>${req.username}</td>
              <td>${req.amount} USDT</td>
              <td>${req.txid}</td>
              <td>${req.date}</td>
              <td>
                <div class="action-btns">
                  <button class="btn-approve" onclick="handleDeposit('${req.id}', 'approve')">قبول</button>
                  <button class="btn-reject" onclick="handleDeposit('${req.id}', 'reject')">رفض</button>
                </div>
              </td>
            </tr>
          `;
        });
      }

      // عرض طلبات السحب المعلقة
      const withdrawTbody = document.getElementById("withdrawRequestsTable");
      withdrawTbody.innerHTML = "";
      if (!db.withdrawRequests || db.withdrawRequests.filter(r => r.status === 'pending').length === 0) {
        withdrawTbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">لا توجد طلبات سحب معلقة</td></tr>`;
      } else {
        db.withdrawRequests.filter(r => r.status === 'pending').forEach((req) => {
          withdrawTbody.innerHTML += `
            <tr>
              <td>${req.username}</td>
              <td>${req.amount} USDT</td>
              <td>${req.address}</td>
              <td>${req.date}</td>
              <td>
                <div class="action-btns">
                  <button class="btn-approve" onclick="handleWithdraw('${req.id}', 'approve')">قبول</button>
                  <button class="btn-reject" onclick="handleWithdraw('${req.id}', 'reject')">رفض</button>
                </div>
              </td>
            </tr>
          `;
        });
      }

      // عرض قائمة المستخدمين للتحكم بأرصدتهم
      const usersTbody = document.getElementById("usersTable");
      usersTbody.innerHTML = "";
      db.users.forEach(u => {
        usersTbody.innerHTML += `
          <tr>
            <td>${u.username}</td>
            <td>${(u.balance || 0).toFixed(2)} USDT</td>
            <td>${u.vip || 'VIP0'}</td>
            <td>
              <button style="padding: 4px 8px; font-size: 0.75rem;" onclick="modifyUserBalance('${u.username}')">تعديل الرصيد</button>
            </td>
          </tr>
        `;
      });
    }

    async function handleDeposit(reqId, action) {
      const db = await getCloudDB();
      const reqIndex = db.depositRequests.findIndex(r => r.id === reqId);
      if (reqIndex === -1) return;

      const req = db.depositRequests[reqIndex];
      const userIndex = db.users.findIndex(u => u.username === req.username);

      if (action === 'approve') {
        if (userIndex !== -1) {
          db.users[userIndex].balance = (db.users[userIndex].balance || 0) + req.amount;
          db.users[userIndex].totalDeposit = (db.users[userIndex].totalDeposit || 0) + req.amount;
          
          // تحديث حالة السجل في تاريخ المستخدم
          if (db.users[userIndex].history) {
            const hist = db.users[userIndex].history.find(h => h.id === reqId);
            if (hist) {
              hist.status = 'completed';
              hist.title = 'إيداع مقبول';
            }
          }
        }
        req.status = 'approved';
        alert("تمت الموافقة على الإيداع وإضافة الرصيد للمستخدم بنجاح.");
      } else {
        req.status = 'rejected';
        if (userIndex !== -1 && db.users[userIndex].history) {
          const hist = db.users[userIndex].history.find(h => h.id === reqId);
          if (hist) {
            hist.status = 'rejected';
            hist.title = 'إيداع مرفوض';
          }
        }
        alert("تم رفض طلب الإيداع.");
      }

      await updateCloudDB(db);
      loadAdminData();
    }

    async function handleWithdraw(reqId, action) {
      const db = await getCloudDB();
      const reqIndex = db.withdrawRequests.findIndex(r => r.id === reqId);
      if (reqIndex === -1) return;

      const req = db.withdrawRequests[reqIndex];
      const userIndex = db.users.findIndex(u => u.username === req.username);

      if (action === 'approve') {
        req.status = 'approved';
        if (userIndex !== -1 && db.users[userIndex].history) {
          const hist = db.users[userIndex].history.find(h => h.id === reqId);
          if (hist) {
            hist.status = 'completed';
            hist.title = 'سحب مقبول';
          }
        }
        alert("تمت الموافقة على طلب السحب.");
      } else {
        // إذا رُفض السحب، يُعاد المبلغ إلى رصيد المستخدم
        if (userIndex !== -1) {
          db.users[userIndex].balance = (db.users[userIndex].balance || 0) + req.amount;
          if (db.users[userIndex].history) {
            const hist = db.users[userIndex].history.find(h => h.id === reqId);
            if (hist) {
              hist.status = 'rejected';
              hist.title = 'سحب مرفوض (مسترجع)';
            }
          }
        }
        req.status = 'rejected';
        alert("تم رفض طلب السحب وإعادة المبلغ لحساب المستخدم.");
      }

      await updateCloudDB(db);
      loadAdminData();
    }

    async function modifyUserBalance(username) {
      const newBalanceStr = prompt(`أدخل الرصيد الجديد للمستخدم ${username}:`);
      if (newBalanceStr === null) return;
      const newBalance = parseFloat(newBalanceStr);
      if (isNaN(newBalance)) {
        alert("قيمة غير صالحة.");
        return;
      }

      const db = await getCloudDB();
      const userIndex = db.users.findIndex(u => u.username === username);
      if (userIndex !== -1) {
        db.users[userIndex].balance = newBalance;
        await updateCloudDB(db);
        alert("تم تحديث الرصيد بنجاح!");
        loadAdminData();
      }
    }

    loadAdminData();
  </script>
</body>
</html>
