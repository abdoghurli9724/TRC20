<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #1e293b; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #334155; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0369a1; }
        .user-list { max-height: 200px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; }
        .user-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; cursor: pointer; }
        .user-item:hover { background: #1e293b; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 20px;">لوحة إدارة VirtualMall</h1>

    <!-- قسم البحث وعرض جميع المشتركين -->
    <div class="card">
        <h2><i class="fa-solid fa-users"></i> إدارة المستخدمين</h2>
        <input type="text" id="searchInput" onkeyup="filterUsers()" placeholder="ابحث عن رقم هاتف...">
        <div class="user-list" id="usersContainer">
            <!-- يتم تحميل الأرقام هنا -->
        </div>
    </div>

    <!-- قسم تعديل بيانات مشترك معين بركمه -->
    <div class="card">
        <h2><i class="fa-solid fa-user-gear"></i> تعديل حساب مشترك (بالرقم)</h2>
        <input type="text" id="targetPhone" placeholder="رقم هاتف المشترك (مثال: 099999999)">
        <input type="number" id="newBalance" placeholder="الرصيد الجديد ($)">
        <select id="newVip">
            <option value="VIP0">VIP0</option>
            <option value="VIP1">VIP1</option>
            <option value="VIP2">VIP2</option>
            <option value="VIP3">VIP3</option>
        </select>
        <button onclick="updateUserData()">تحديث بيانات المشترك</button>
    </div>

    <!-- قسم التحكم بالعروض والصور والأسباب -->
    <div class="card">
        <h2><i class="fa-solid fa-rectangle-ad"></i> التحكم بالعروض والباقات</h2>
        <select id="offerVipLevel">
            <option value="VIP1">تعديل VIP1</option>
            <option value="VIP2">تعديل VIP2</option>
            <option value="VIP3">تعديل VIP3</option>
        </select>
        <input type="number" id="offerPrice" placeholder="سعر الاشتراك ($)">
        <input type="number" id="offerDailyProfit" placeholder="الربح اليومي ($)">
        <input type="text" id="offerImg" placeholder="رابط صورة العرض (URL)">
        <button onclick="saveOfferSettings()" style="background: #16a34a;">حفظ إعدادات العرض</button>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    let allUsers = {};

    document.addEventListener("DOMContentLoaded", async function() {
        await loadAdminData();
    });

    async function loadAdminData() {
        let serverData = await fetchServerData();
        allUsers = serverData.usersDB || {};
        renderUsers(allUsers);
    }

    function renderUsers(users) {
        const container = document.getElementById('usersContainer');
        container.innerHTML = '';
        Object.keys(users).forEach(phone => {
            container.innerHTML += `
                <div class="user-item" onclick="selectUser('${phone}')">
                    <span>${phone}</span>
                    <span style="color:#38bdf8">${users[phone].vipLevel || 'VIP0'} | $${users[phone].balance || 0}</span>
                </div>
            `;
        });
    }

    function filterUsers() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = {};
        Object.keys(allUsers).forEach(phone => {
            if(phone.includes(q)) filtered[phone] = allUsers[phone];
        });
        renderUsers(filtered);
    }

    function selectUser(phone) {
        document.getElementById('targetPhone').value = phone;
        document.getElementById('newBalance').value = allUsers[phone].balance || 0;
        document.getElementById('newVip').value = allUsers[phone].vipLevel || 'VIP0';
    }

    async function updateUserData() {
        const phone = document.getElementById('targetPhone').value.trim();
        const balance = parseFloat(document.getElementById('newBalance').value);
        const vip = document.getElementById('newVip').value;

        if (!phone || !allUsers[phone]) return alert('يرجى اختيار رقم مشترك صحيح!');

        let serverData = await fetchServerData();
        serverData.usersDB[phone].balance = balance;
        serverData.usersDB[phone].vipLevel = vip;

        await updateServerData(serverData);
        alert('تم تعديل بيانات المستخدم بنجاح!');
        loadAdminData();
    }

    async function saveOfferSettings() {
        const vip = document.getElementById('offerVipLevel').value;
        const price = parseFloat(document.getElementById('offerPrice').value);
        const profit = parseFloat(document.getElementById('offerDailyProfit').value);
        const img = document.getElementById('offerImg').value;

        let serverData = await fetchServerData();
        if (!serverData.offers) serverData.offers = {};

        serverData.offers[vip] = { price, profit, img };

        await updateServerData(serverData);
        alert('تم حفظ العرض بنجاح!');
    }
</script>
</body>
</html>
