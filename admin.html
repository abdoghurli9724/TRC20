<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - VirtualMall</title>
  <link rel="stylesheet" href="profile.css">
  <style>
    .admin-section { margin-bottom: 24px; }
    .table-container { overflow-x: auto; margin-top: 10px; width: 100%; }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.8rem; }
    th, td { padding: 10px 6px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
    th { color: var(--accent-gold); background: var(--bg-secondary); }
    .action-btns { display: flex; gap: 4px; }
    .btn-approve { background: var(--accent-green); color: #fff; padding: 5px 8px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-reject { background: #ef4444; color: #fff; padding: 5px 8px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background: #3b82f6; color: #fff; padding: 5px 8px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-secondary); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
    .stat-card h4 { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-card p { font-size: 1rem; color: var(--accent-gold); font-weight: bold; }
    .user-card-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info div { font-size: 0.8rem; margin-bottom: 2px; color: var(--text-primary); }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-logo"><i class="fa-solid fa-user-shield" style="color: var(--accent-gold);"></i> لوحة تحكم <span>الآدمن</span></div>
    <button onclick="logoutUser()" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; cursor: pointer;">خروج</button>
  </div>

  <div style="padding: 15px;">
    
    <!-- إحصائيات عامة سريعة -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4>المستخدمون</h4>
        <p id="totalUsersCount">0</p>
      </div>
      <div class="stat-card">
        <h4>إيداعات معلقة</h4>
        <p id="pendingDepositsCount">0</p>
      </div>
      <div class="stat-card">
        <h4>سحوبات معلقة</h4>
        <p id="pendingWithdrawsCount">0</p>
      </div>
    </div>

    <!-- قسم طلبات الإيداع -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 0.95rem; margin-bottom: 8px;">طلبات الإيداع المعلقة</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>المبلغ</th>
              <th>TXID / Hash</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="depositRequestsTable">
            <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- قسم طلبات السحب -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 0.95rem; margin-bottom: 8px;">طلبات السحب المعلقة</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>المبلغ</th>
              <th>المحفظة</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="withdrawRequestsTable">
            <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- قسم إدارة المستخدمين والرصيد -->
    <div class="card-box admin-section">
      <h3 style="color: var(--accent-gold); font-size: 0.95rem; margin-bottom: 8px;">إدارة أرصدة ومستويات المستخدمين</h3>
      <div id="usersListContainer">
        <div style="text-align: center; color: var(--text-secondary);">جاري جلب المستخدمين...</div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    async function loadAdminData() {
      try {
        const db = await getCloudDB();
        if (!db || !db.users) {
          document.getElementById("usersListContainer").innerHTML = `<div style="text-align: center; color: red;">فشل الاتصال بقاعدة البيانات</div>`;
          return;
        }

        const usersList = db.users || [];
        const depositReqs = db.depositRequests || [];
        const withdrawReqs = db.withdrawRequests || [];

        const pendingDeposits = depositReqs.filter(r => r.status === 'pending');
        const pendingWithdraws = withdrawReqs.filter(r => r.status === 'pending');
        
        document.getElementById("totalUsersCount").innerText = usersList.length;
        document.getElementById("pendingDepositsCount").innerText = pendingDeposits.length;
        document.getElementById("pendingWithdrawsCount").innerText = pendingWithdraws.length;

        // طلبات الإيداع
        const depositTbody = document.getElementById("depositRequestsTable");
        depositTbody.innerHTML = "";
        if (pendingDeposits.length === 0) {
          depositTbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">لا توجد طلبات إيداع معلقة</td></tr>`;
        } else {
          pendingDeposits.forEach((req) => {
            depositTbody.innerHTML += `
              <tr>
                <td>${req.username || 'مجهول'}</td>
                <td>${req.amount || 0}</td>
                <td>${req.txHash || req.txid || '-'}</td>
                <td>
                  <div class="action-btns">
                    <button class="btn-approve" onclick="handleDeposit('${req.id}', 'approve')">قبول</button>
                    <button class="btn-reject" onclick="handleDeposit('${req.id}', 'reject')">رفض</button>
                  </div>
                </td>
              </tr>
            `;
          });
        }

        // طلبات السحب
        const withdrawTbody = document.getElementById("withdrawRequestsTable");
        withdrawTbody.innerHTML = "";
        if (pendingWithdraws.length === 0) {
          withdrawTbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">لا توجد طلبات سحب معلقة</td></tr>`;
        } else {
          pendingWithdraws.forEach((req) => {
            withdrawTbody.innerHTML += `
              <tr>
                <td>${req.username || 'مجهول'}</td>
                <td>${req.amount || 0}</td>
                <td>${req.address ? req.address.substring(0,6) + '...' : '-'}</td>
                <td>
                  <div class="action-btns">
                    <button class="btn-approve" onclick="handleWithdraw('${req.id}', 'approve')">قبول</button>
                    <button class="btn-reject" onclick="handleWithdraw('${req.id}', 'reject')">رفض</button>
                  </div>
                </td>
              </tr>
            `;
          });
        }

        // عرض قائمة المستخدمين (تظهر الأسماء والأرصدة والمستويات مباشرة)
        const usersContainer = document.getElementById("usersListContainer");
        usersContainer.innerHTML = "";
        if (usersList.length === 0) {
          usersContainer.innerHTML = `<div style="text-align: center; color: var(--text-secondary);">لا يوجد مستخدمون مسجلون حالياً</div>`;
        } else {
          usersList.forEach((u) => {
            const uname = u.username || 'مستخدم';
            const ubal = Number(u.balance || 0).toFixed(2);
            const uvip = u.vip || 'VIP0';
            
            usersContainer.innerHTML += `
              <div class="user-card-item">
                <div class="user-info">
                  <div style="color: var(--accent-gold); font-weight: bold;">👤 ${uname}</div>
                  <div>الرصيد: <span style="color: #10b981;">${ubal} USDT</span></div>
                  <div>المستوى: ${uvip}</div>
                </div>
                <div class="action-btns">
                  <button class="btn-edit" onclick="modifyUserBalance('${uname}')">الرصيد</button>
                  <button class="btn-approve" style="background:#8b5cf6;" onclick="modifyUserVip('${uname}')">VIP</button>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleDeposit(reqId, action) {
      const db = await getCloudDB();
      if (!db.depositRequests) return;
      const reqIndex = db.depositRequests.findIndex(r => r.id === reqId);
      if (reqIndex === -1) return;

      const req = db.depositRequests[reqIndex];
      const userIndex = db.users.findIndex(u => u.username === req.username);

      if (action === 'approve') {
        if (userIndex !== -1) {
          db.users[userIndex].balance = Number(db.users[userIndex].balance || 0) + Number(req.amount);
        }
        req.status = 'approved';
        alert("تمت الموافقة على الإيداع.");
      } else {
        req.status = 'rejected';
        alert("تم رفض طلب الإيداع.");
      }

      await updateCloudDB(db);
      loadAdminData();
    }

    async function handleWithdraw(reqId, action) {
      const db = await getCloudDB();
      if (!db.withdrawRequests) return;
      const reqIndex = db.withdrawRequests.findIndex(r => r.id === reqId);
      if (reqIndex === -1) return;

      const req = db.withdrawRequests[reqIndex];
      const userIndex = db.users.findIndex(u => u.username === req.username);

      if (action === 'approve') {
        req.status = 'approved';
        alert("تمت الموافقة على السحب.");
      } else {
        if (userIndex !== -1) {
          db.users[userIndex].balance = Number(db.users[userIndex].balance || 0) + Number(req.amount);
        }
        req.status = 'rejected';
        alert("تم رفض السحب وإعادة المبلغ.");
      }

      await updateCloudDB(db);
      loadAdminData();
    }

    async function modifyUserBalance(username) {
      const newBalanceStr = prompt(`أدخل الرصيد الجديد للمستخدم ${username}:`);
      if (newBalanceStr === null) return;
      const newBalance = parseFloat(newBalanceStr);
      if (isNaN(newBalance)) {
        alert("قيمة غير صالحة.");
        return;
      }

      const db = await getCloudDB();
      if (!db.users) return;
      const userIndex = db.users.findIndex(u => u.username === username);
      if (userIndex !== -1) {
        db.users[userIndex].balance = newBalance;
        await updateCloudDB(db);
        alert("تم تحديث الرصيد وحفظه في JSONBin بنجاح!");
        loadAdminData();
      }
    }

    async function modifyUserVip(username) {
      const newVip = prompt(`أدخل مستوى الـ VIP الجديد للمستخدم ${username} (مثال: VIP1, VIP2):`);
      if (!newVip) return;

      const db = await getCloudDB();
      if (!db.users) return;
      const userIndex = db.users.findIndex(u => u.username === username);
      if (userIndex !== -1) {
        db.users[userIndex].vip = newVip.trim().toUpperCase();
        await updateCloudDB(db);
        alert("تم تحديث مستوى VIP وحفظه في JSONBin بنجاح!");
        loadAdminData();
      }
    }

    loadAdminData();
  </script>
</body>
</html>
