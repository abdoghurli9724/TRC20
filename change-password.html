<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualMall - تغيير كلمة المرور</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="header-bar">
    <div class="brand-logo">
      <i class="fa-solid fa-lock-rotate" style="color: var(--accent-blue);"></i>
      تغيير <span>كلمة المرور</span>
    </div>
    <a href="profile.html" style="color: var(--text-primary); font-size: 1.2rem;">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
  </header>

  <main style="max-width: 500px; margin: 20px auto 80px auto; padding: 0 16px;">

    <!-- Password Change Card -->
    <div class="card-box">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; margin: 0 auto 12px auto; border: 1px solid var(--accent-blue);">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 4px;">تحديث كلمة المرور والحساب</h2>
        <p style="font-size: 0.8rem; color: var(--text-secondary);">يرجى أدخل كلمة المرور الحالية ثم كلمة المرور الجديدة للحفاظ على أمان حسابك.</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.85rem; text-align: center;"></div>

      <form id="changePasswordPageForm">
        <!-- Old Password -->
        <div class="form-group">
          <label class="form-label" for="currentPasswordInput">كلمة المرور الحالية:</label>
          <input type="password" id="currentPasswordInput" class="form-input" placeholder="أدخل كلمة المرور الحالية" required>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label class="form-label" for="newPasswordInput">كلمة المرور الجديدة:</label>
          <input type="password" id="newPasswordInput" class="form-input" placeholder="أدخل كلمة المرور الجديدة (6 خانات على الأقل)" required>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group">
          <label class="form-label" for="confirmPasswordInput">تأكيد كلمة المرور الجديدة:</label>
          <input type="password" id="confirmPasswordInput" class="form-input" placeholder="أعد كتابة كلمة المرور الجديدة" required>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn" style="background-color: var(--accent-blue); margin-top: 8px;">
          <span id="btnText">تأكيد وتحديث في السحابة</span>
          <span id="btnSpinner" class="spinner" style="display: none;"></span>
        </button>
      </form>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <i class="fa-solid fa-list-check"></i>
      <span>المهام</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
      <span>الفريق</span>
    </a>
    <a href="vip.html" class="nav-item">
      <i class="fa-solid fa-crown"></i>
      <span>VIP</span>
    </a>
  </nav>

  <!-- Database Script -->
  <script src="db.js"></script>

  <!-- Page Script Logic -->
  <script>
    let currentUserObj = null;

    // Verify Active Session on Load
    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('currentUser');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      try {
        currentUserObj = await getCurrentUser();
        if (!currentUserObj) {
          logoutUser();
          return;
        }
      } catch (error) {
        console.error('Error loading password change page:', error);
      }
    });

    // Alert Message Helper
    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'block';
      alertBox.innerText = message;
      if (type === 'error') {
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
        alertBox.style.color = 'var(--accent-red)';
        alertBox.style.border = '1px solid var(--accent-red)';
      } else {
        alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
        alertBox.style.color = 'var(--accent-green)';
        alertBox.style.border = '1px solid var(--accent-green)';
      }
    }

    // Handle Form Submit
    document.getElementById('changePasswordPageForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const currentPassword = document.getElementById('currentPasswordInput').value;
      const newPassword = document.getElementById('newPasswordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      // Validation Rules
      if (currentPassword !== currentUserObj.password) {
        showAlert('كلمة المرور الحالية غير صحيحة!', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showAlert('كلمة المرور الجديدة يجب أن تتكون من 6 أرقام/حروف على الأقل', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('كلمتا المرور الجديدة وتأكيدها غير متطابقتين', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const db = await getCloudDB();
        const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);

        if (userIndex !== -1) {
          // Update User Password in DB
          db.users[userIndex].password = newPassword;

          // Sync to JSONBin Cloud
          const success = await updateCloudDB(db);

          if (success) {
            currentUserObj.password = newPassword;
            showAlert('تم تغيير كلمة المرور وتحديث البيانات في السحابة بنجاح!', 'success');
            document.getElementById('changePasswordPageForm').reset();

            setTimeout(() => {
              window.location.href = 'profile.html';
            }, 1800);
          } else {
            showAlert('حدث خطأ أثناء الاتصال بالسحابة، يرجى إعادة المحاولة', 'error');
            submitBtn.disabled = false;
            btnText.style.display = 'inline';
            btnSpinner.style.display = 'none';
          }
        }
      } catch (error) {
        console.error('Password Update Error:', error);
        showAlert('فشل الاتصال بالسيرفر، حاول مرة أخرى لاحقاً', 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
