<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mall - إيداع رصيد</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-main: #0b1021;
      --card-bg: #151b31;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: rgba(11, 16, 33, 0.9);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    .main-container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
    
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
    .form-control {
      width: 100%; background: #0f172a; border: 1px solid var(--border-color);
      padding: 12px; border-radius: var(--radius-sm); color: var(--text-main); font-size: 1rem; outline: none;
    }
    .form-control:focus { border-color: var(--accent-blue); }

    .submit-btn {
      width: 100%; background: var(--accent-blue); color: white; border: none;
      padding: 14px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .alert-box {
      padding: 12px; border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 0.9rem; display: none; text-align: center;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }

    .wallet-info {
      background: #0f172a; padding: 15px; border-radius: var(--radius-sm);
      border: 1px dashed var(--border-color); margin-bottom: 15px; font-size: 0.85rem; word-break: break-all;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='index.html'">
      <i class="bi bi-arrow-right" style="font-size: 1.2rem;"></i>
      <span style="font-weight: 700;">إيداع رصيد USDT</span>
    </div>
  </header>

  <div class="main-container">
    <div class="form-card">
      <div id="alertBox" class="alert-box"></div>

      <div class="wallet-info">
        <p style="color: var(--text-muted); margin-bottom: 6px;">عنوان محفظة الإيداع (USDT - TRC20):</p>
        <strong id="walletAddressText" style="color: var(--accent-blue);">T***********************************</strong>
      </div>

      <form id="depositForm">
        <div class="form-group">
          <label>مبلغ الإيداع ($)</label>
          <input type="number" id="depositAmount" class="form-control" placeholder="الحد الأدنى 10$" min="10" step="any" required>
        </div>
        
        <div class="form-group">
          <label>رقم معاملة التحويل (TXID)</label>
          <input type="text" id="txHash" class="form-control" placeholder="أدخل هاش التحويل بعد إتمام الدفع" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="btnText">تأكيد وإرسال الطلب</span>
          <span id="btnSpinner" style="display: none;"><i class="bi bi-arrow-repeat" style="animation: spin 1s linear infinite; display: inline-block;"></i> جاري الإرسال...</span>
        </button>
      </form>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    let currentUserObj = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const activeUsername = localStorage.getItem('activeUsername');
      if (!activeUsername) {
        window.location.href = 'login.html';
        return;
      }

      const db = await getCloudDB();
      currentUserObj = db.users.find(u => u.username === activeUsername);
      if (!currentUserObj) {
        window.location.href = 'login.html';
        return;
      }

      // جلب عنوان المحفظة من الإعدادات العامة إن وجد
      if (db.settings && db.settings.usdtWallet) {
        document.getElementById('walletAddressText').innerText = db.settings.usdtWallet;
      }
    });

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert-box alert-${type}`;
      box.innerText = msg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const amount = parseFloat(document.getElementById('depositAmount').value);
      const txHash = document.getElementById('txHash').value.trim();

      if (isNaN(amount) || amount < 10) {
        showAlert('الحد الأدنى للإيداع هو $10', 'error');
        return;
      }

      if (!txHash || txHash.length < 8) {
        showAlert('يرجى إدخال رقم معاملة (TXID) صحيح', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const db = await getCloudDB();
        if (!db.records) db.records = [];

        const recordId = 'DEP-' + Math.floor(100000 + Math.random() * 900000);
        const currentDate = new Date().toLocaleString('ar-EG');

        // إضافة الطلب إلى مصفوفة السجلات العامة لكي يظهر في لوحة الأدمن
        db.records.unshift({
          id: recordId,
          type: "إيداع",
          username: currentUserObj.username,
          amount: amount,
          details: txHash,
          status: "قيد الانتظار",
          date: currentDate
        });

        // إضافة الطلب لسجل المستخدم الخاص
        const userIndex = db.users.findIndex(u => u.username === currentUserObj.username);
        if (userIndex !== -1) {
          if (!db.users[userIndex].history) db.users[userIndex].history = [];
          db.users[userIndex].history.unshift({
            id: recordId,
            type: "deposit",
            title: "طلب إيداع رصيد (USDT-TRC20)",
            amount: amount,
            txHash: txHash,
            status: "pending",
            date: currentDate
          });
        }

        const success = await updateCloudDB(db);

        if (success) {
          showAlert('تم إرسال طلب الإيداع بنجاح! سيتم مراجعته وإضافته لحسابك قريباً.', 'success');
          document.getElementById('depositForm').reset();
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          showAlert('حدث خطأ أثناء رفع الطلب للسحابة، حاول ثانية.', 'error');
          submitBtn.disabled = false;
          btnText.style.display = 'inline';
          btnSpinner.style.display = 'none';
        }
      } catch (error) {
        console.error('Deposit Error:', error);
        showAlert('فشل الاتصال بالسيرفر، يرجى المحاولة لاحقاً', 'error');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
